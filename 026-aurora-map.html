<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora — Intensity Field</title>
<style>
  :root{
    --night:#04060f; --night2:#070b1c;
    --green:#4dffc4; --green2:#17d68a; --pink:#ff6fd8; --pink2:#c85bff;
    --ink:#cfe6ff; --dim:#6f86ad; --line:rgba(120,160,210,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--night);overflow:hidden}
  body{
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    color:var(--ink);
    background:
      radial-gradient(120% 90% at 50% 118%, rgba(30,90,120,.35), transparent 60%),
      radial-gradient(140% 120% at 82% 6%, rgba(120,40,120,.22), transparent 55%),
      linear-gradient(180deg,#04060f 0%, #060a19 45%, #05070f 100%);
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* vignette + horizon haze */
  .haze{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(120% 70% at 50% 100%, rgba(77,255,196,.06), transparent 60%),
      radial-gradient(130% 90% at 50% 0%, rgba(0,0,0,.55), transparent 55%);}

  .grid-lines{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:12.5% 1px; background-position:0 100%;
    mask-image:linear-gradient(180deg, transparent, #000 78%);}

  .ui{position:fixed;inset:0;z-index:6;pointer-events:none;padding:clamp(16px,3vw,34px);
    display:flex;flex-direction:column;justify-content:space-between;gap:18px}

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
  .brand{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);line-height:1.9}
  .brand b{display:block;font-size:13px;letter-spacing:.22em;color:var(--ink);margin-top:4px}
  .brand .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;
    background:var(--green);box-shadow:0 0 10px var(--green);vertical-align:middle;
    animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.25)}}

  .coords{text-align:right;font-size:10px;letter-spacing:.16em;color:var(--dim);line-height:1.9}
  .coords b{color:var(--ink);font-weight:400}

  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .kp{display:flex;align-items:flex-end;gap:14px}
  .kp .num{font-size:clamp(46px,9vw,104px);line-height:.82;font-weight:400;letter-spacing:-.02em;
    background:linear-gradient(180deg,#eafff6,var(--green) 60%, rgba(77,255,196,0));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(77,255,196,.35));font-variant-numeric:tabular-nums}
  .kp .lab{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);line-height:1.7;max-width:12ch}
  .kp .lab b{color:var(--green);display:block;font-size:12px}

  .panel{border:1px solid var(--line);border-radius:4px;padding:12px 15px;min-width:210px;
    background:linear-gradient(180deg, rgba(10,16,30,.5), rgba(6,10,22,.35));
    backdrop-filter:blur(3px);box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .panel .row{display:flex;justify-content:space-between;gap:16px;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);line-height:1.9}
  .panel .row b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
  .panel .row .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .bars{display:flex;gap:3px;align-items:flex-end;height:26px;margin-top:9px}
  .bars i{flex:1;background:linear-gradient(180deg,var(--green),rgba(23,214,138,.25));border-radius:1px 1px 0 0;height:12%}
  .bars i.p{background:linear-gradient(180deg,var(--pink),rgba(200,91,255,.2))}

  .tag{position:fixed;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:6;pointer-events:none}
  .tag.a{left:clamp(16px,3vw,34px);bottom:calc(50% + 6vh)}
  .tag.b{right:clamp(16px,3vw,34px);top:calc(50% - 8vh);text-align:right}
  .tag em{font-style:normal;color:var(--green);display:block;font-size:11px;margin-top:3px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  @media (max-width:560px){
    .coords{display:none}
    .panel{min-width:0;flex:1}
    .tag{display:none}
  }
</style>
</head>
<body>
  <canvas id="aurora" aria-hidden="true"></canvas>
  <div class="haze"></div>
  <div class="grid-lines" aria-hidden="true"></div>

  <div class="ui">
    <div class="top">
      <div class="brand"><span class="dot"></span>MERIDIAN&nbsp;·&nbsp;SPACE&nbsp;WEATHER<b>Aurora Intensity Field</b></div>
      <div class="coords">
        LAT <b>64°51′N</b> · LON <b>19°02′W</b><br>
        ALT <b>312&nbsp;km</b> · MLT <b>22.4</b><br>
        <span id="clock">—</span>
      </div>
    </div>

    <div class="bottom">
      <div class="kp">
        <div class="num" id="kpnum">6.2</div>
        <div class="lab">Kp index<br><b id="kplab">ACTIVE</b></div>
      </div>
      <div class="panel">
        <div class="row"><span>Geomag. Kp</span><b id="kp2">6.2</b></div>
        <div class="row"><span>Electron flux</span><b id="flux">3.4×10<sup>8</sup> cm⁻²s⁻¹</b></div>
        <div class="row"><span>Peak λ</span><b>557.7&nbsp;nm&nbsp;O&nbsp;I</b></div>
        <div class="row"><span>Status</span><b style="color:var(--green)">CURTAIN · STABLE</b></div>
        <div class="bars" id="bars"></div>
      </div>
    </div>
  </div>

  <div class="tag a">Curtain base <em id="cbalt">312 km</em></div>
  <div class="tag b">Oxygen green line <em>557.7 nm</em></div>

<script>
(function(){
  "use strict";
  var cv = document.getElementById('aurora');
  var ctx = cv.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio||1, 2);
  var W=0,H=0, stars=[], layers=[];

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    seed();
  }

  function seed(){
    // starfield
    stars = [];
    var n = Math.round((W*H)/9000);
    for(var i=0;i<n;i++){
      stars.push({ x:Math.random()*W, y:Math.random()*H*0.72,
        r:Math.random()*1.2+0.2, tw:Math.random()*6.28, sp:Math.random()*1.6+0.4 });
    }
    // aurora layers: back→front, pinker higher/fainter, greener lower/brighter
    var defs = [
      { base:0.30, amp:0.16, freq:1.5, speed:0.10, phase:0.0, w:0.55, col:[200,91,255], a:0.16 },
      { base:0.40, amp:0.13, freq:1.9, speed:0.14, phase:1.7, w:0.50, col:[255,111,216], a:0.18 },
      { base:0.52, amp:0.15, freq:2.3, speed:0.18, phase:3.1, w:0.45, col:[120,230,255], a:0.16 },
      { base:0.64, amp:0.17, freq:2.8, speed:0.22, phase:0.8, w:0.42, col:[77,255,196], a:0.22 },
      { base:0.78, amp:0.20, freq:3.4, speed:0.28, phase:2.4, w:0.40, col:[23,214,138], a:0.24 }
    ];
    layers = defs.map(function(d){
      var cols=48, pts=[];
      for(var c=0;c<=cols;c++) pts.push(0);
      return { d:d, pts:pts, cols:cols };
    });
  }

  function wave(x, L, t){
    var d=L.d;
    var s = Math.sin(x*0.0016*d.freq + t*d.speed + d.phase);
    s += 0.45*Math.sin(x*0.0041*d.freq - t*d.speed*1.7 + d.phase*1.3);
    s += 0.22*Math.sin(x*0.009*d.freq + t*d.speed*0.6);
    return s;
  }

  function drawCurtain(L, t, horizon){
    var d=L.d, cols=L.cols, pts=L.pts;
    var baseY = horizon*d.base;
    var ampY = H*d.amp;
    var step = W/cols;
    for(var c=0;c<=cols;c++){
      var x = c*step;
      var s = wave(x, L, t);
      // vertical shimmer columns
      var h = ampY*(0.55 + 0.45*s);
      pts[c] = h;
    }
    // draw as vertical light columns for curtain texture
    var c1 = 'rgba('+d.col[0]+','+d.col[1]+','+d.col[2]+','+d.a+')';
    var c2 = 'rgba('+d.col[0]+','+d.col[1]+','+d.col[2]+',0)';
    for(var c=0;c<cols;c++){
      var x = c*step;
      var h = pts[c] + pts[c+1];
      h = h*0.5;
      var grad = ctx.createLinearGradient(0, baseY - h, 0, baseY + H*0.06);
      grad.addColorStop(0, c2);
      grad.addColorStop(0.35, c1);
      grad.addColorStop(1, c2);
      ctx.fillStyle = grad;
      ctx.fillRect(x, baseY - h, step+1, h + H*0.06);
    }
  }

  var t0 = performance.now();
  function frame(now){
    var t = (now - t0)/1000;
    ctx.clearRect(0,0,W,H);

    // stars
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var tw = 0.55 + 0.45*Math.sin(t*s.sp + s.tw);
      ctx.globalAlpha = tw*0.9;
      ctx.fillStyle = '#dff0ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    var horizon = H;
    ctx.globalCompositeOperation = 'lighter';
    // back layers first (fainter, higher)
    for(var i=0;i<layers.length;i++){ drawCurtain(layers[i], t, horizon); }
    ctx.globalCompositeOperation = 'source-over';

    // soft glow horizon band
    var g = ctx.createLinearGradient(0, H*0.86, 0, H);
    g.addColorStop(0, 'rgba(77,255,196,0)');
    g.addColorStop(1, 'rgba(77,255,196,0.05)');
    ctx.fillStyle = g;
    ctx.fillRect(0, H*0.86, W, H*0.14);

    requestAnimationFrame(frame);
  }

  // ---- data readouts ----
  var bars = document.getElementById('bars');
  var bkids=[];
  for(var i=0;i<24;i++){
    var b=document.createElement('i');
    if(i>=16) b.className='p';
    bars.appendChild(b); bkids.push(b);
  }
  function tickBars(){
    for(var i=0;i<bkids.length;i++){
      var v = 20 + 70*(0.5+0.5*Math.sin(performance.now()*0.0016 + i*0.6));
      bkids[i].style.height = v.toFixed(0)+'%';
    }
  }
  setInterval(tickBars, 120);

  var kpEl=document.getElementById('kpnum'), kp2=document.getElementById('kp2'),
      kpl=document.getElementById('kplab'), flux=document.getElementById('flux'),
      cb=document.getElementById('cbalt'), clock=document.getElementById('clock');
  function tickData(){
    var kp = 5.4 + 1.3*Math.sin(performance.now()*0.00021);
    kp = Math.max(3.2, Math.min(8.1, kp));
    kpEl.textContent = kp.toFixed(1);
    kp2.textContent = kp.toFixed(1);
    kpl.textContent = kp>6.5?'STRONG':kp>5?'ACTIVE':'QUIET';
    var f = (2.4 + 1.6*Math.abs(Math.sin(performance.now()*0.0003)));
    flux.innerHTML = f.toFixed(1)+'×10<sup>8</sup> cm⁻²s⁻¹';
    var alt = 290 + Math.round(40*Math.sin(performance.now()*0.00028));
    cb.textContent = alt+' km';
    var d=new Date();
    clock.textContent = ('0'+d.getUTCHours()).slice(-2)+':'+
      ('0'+d.getUTCMinutes()).slice(-2)+':'+('0'+d.getUTCSeconds()).slice(-2)+' UTC';
  }
  tickData(); setInterval(tickData, 900);

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
