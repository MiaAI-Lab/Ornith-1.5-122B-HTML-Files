<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prisma — Flowing Rainbow Silk</title>
<style>
  :root{ --bg:#05060a; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  .veil{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 30%, rgba(0,0,0,0) 42%, rgba(4,5,10,.55) 100%)}

  .wordmark{position:absolute;left:clamp(18px,4vw,52px);top:clamp(18px,4vh,50px);pointer-events:none;color:#fff}
  .wordmark .en{font-size:clamp(10px,1.4vw,14px);letter-spacing:.46em;text-transform:uppercase;
    color:rgba(255,255,255,.62);font-weight:600}
  .wordmark .title{margin-top:.4em;font-size:clamp(28px,6vw,72px);font-weight:200;letter-spacing:.01em;line-height:.96;
    background:linear-gradient(92deg,#ff8ad0,#ffd36b,#8affc0,#8ad0ff,#c78aff,#ff8ad0);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:sheen 9s linear infinite;
    text-shadow:0 0 40px rgba(255,255,255,.08)}
  @keyframes sheen{0%{background-position:0% 50%}100%{background-position:300% 50%}}

  .verse{position:absolute;left:50%;bottom:clamp(26px,6vh,64px);transform:translateX(-50%);
    pointer-events:none;color:rgba(255,255,255,.72);text-align:center;max-width:min(560px,86vw);
    font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(13px,1.8vw,19px);
    line-height:1.7;letter-spacing:.02em;text-shadow:0 2px 20px rgba(0,0,0,.6)}
  .verse .light{pointer-events:auto;cursor:default}

  .tag{position:absolute;right:clamp(14px,3vw,40px);bottom:clamp(16px,4vh,44px);pointer-events:none;
    color:rgba(255,255,255,.4);font-size:clamp(9px,1.2vw,11px);letter-spacing:.28em;text-transform:uppercase}

  .swatch{position:absolute;left:50%;top:clamp(70px,12vh,120px);transform:translateX(-50%);
    pointer-events:none;display:flex;gap:6px;opacity:.8}
  .swatch i{width:clamp(14px,2vw,22px);height:3px;border-radius:3px;display:block;
    background:linear-gradient(90deg,#ff5d8f,#ff9f43,#ffe66d,#7bed9f,#4bcffa,#a55eea,#ff5d8f)}
</style>
</head>
<body>
<div class="stage">
  <canvas id="silk"></canvas>
  <div class="veil"></div>
  <div class="wordmark">
    <div class="en">Woven Light</div>
    <div class="title">Prisma Silk</div>
  </div>
  <div class="swatch" aria-hidden="true"><i></i></div>
  <div class="verse">
    <span class="light">move across the fabric</span> — the spectrum follows your hand like light on water.
  </div>
  <div class="tag">iridescent · spectral · fluid</div>
</div>
<script>
(function(){
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var cv = document.getElementById("silk");
  var ctx = cv.getContext("2d");

  var W=0, H=0, DPR=1;
  var t=0, lastFrame=0;
  var light = {x:0.5, y:0.35, tx:0.5, ty:0.35, hue:0};

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = Math.round(window.innerWidth*DPR);
    H = Math.round(window.innerHeight*DPR);
    cv.width=W; cv.height=H;
  }

  // smooth easing of the light toward its target
  function easeLight(){
    light.x += (light.tx - light.x)*0.045;
    light.y += (light.ty - light.y)*0.045;
    light.hue += 0.15;
  }

  // spectral sheen: hue driven by position + time + light, with thin-film spread
  function sheenHue(nx, row, y){
    var base = nx*300 + t*26 + row*22 + light.hue;
    // light proximity brightens and cools; away from light warms
    var dl = Math.hypot(nx-light.x, y-light.y);
    return (base + dl*120) % 360;
  }

  function draw(){
    // deep backdrop
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#05060a";
    ctx.fillRect(0,0,W,H);

    var N = 26;                       // number of flowing ribbons
    var step = 7*DPR;                 // horizontal sampling
    var lightX = light.x*W, lightY = light.y*H;

    for(var r=0;r<N;r++){
      var f = r/(N-1);
      var baseY = H*(0.1 + f*0.8);
      var amp = (26 + f*34)*DPR;
      var freq = 0.0016 + f*0.0006;
      var phase = t*(0.55 + f*0.25) + r*0.9;
      var thick = (30 + f*46)*DPR;

      // build the ribbon path (center line)
      var top=[], bot=[];
      for(var x=0;x<=W;x+=step){
        var y = baseY
              + amp*Math.sin(x*freq + phase)
              + amp*0.45*Math.sin(x*freq*2.3 - phase*1.3)
              + Math.sin((x-lightX)*0.006 + t)* 10*DPR*Math.exp(-Math.pow((x-lightX)/(W*0.28),2));
        top.push({x:x, y:y - thick*0.5});
        bot.push({x:x, y:y + thick*0.5});
      }

      // spectral gradient along the ribbon length
      var g = ctx.createLinearGradient(0,0,W,0);
      var stops = 9;
      for(var s=0;s<=stops;s++){
        var nx = s/stops;
        var hx = nx*W;
        var hue = sheenHue(nx, r, f);
        // brightness ridge near the light column
        var near = Math.exp(-Math.pow((nx-light.x)/0.16,2));
        var lgt = 52 + near*26;
        var sat = 88;
        g.addColorStop(nx, "hsl("+hue.toFixed(1)+","+sat+"%,"+lgt+"%)");
      }

      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.26 + 0.14*Math.sin(t*0.6 + r);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(top[0].x, top[0].y);
      for(var i=1;i<top.length;i++) ctx.lineTo(top[i].x, top[i].y);
      for(var j=bot.length-1;j>=0;j--) ctx.lineTo(bot[j].x, bot[j].y);
      ctx.closePath();
      ctx.fill();

      // specular crest highlight — a thin bright streak riding the wave
      ctx.globalAlpha = 0.10 + 0.06*Math.sin(t + r*0.7);
      ctx.strokeStyle = "hsl("+(sheenHue(0.5,r,f)+10)+",100%,88%)";
      ctx.lineWidth = (1.4 + Math.sin(t*0.8+r)*0.6)*DPR;
      ctx.beginPath();
      for(var k=0;k<top.length;k++){
        var yy = (top[k].y + bot[k].y)*0.5 - thick*0.12;
        if(k===0) ctx.moveTo(top[k].x, yy); else ctx.lineTo(top[k].x, yy);
      }
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    // soft light bloom at the pointer
    var bloom = ctx.createRadialGradient(lightX,lightY,0, lightX,lightY, W*0.42);
    bloom.addColorStop(0, "hsla("+(light.hue+200)+",100%,80%,0.16)");
    bloom.addColorStop(1, "hsla(0,0%,0%,0)");
    ctx.fillStyle = bloom;
    ctx.fillRect(0,0,W,H);
  }

  function loop(ts){
    if(!lastFrame) lastFrame = ts;
    var dt = (ts - lastFrame)/1000; lastFrame = ts;
    if(!reduce) t += dt*0.9;
    easeLight();
    draw();
    if(!reduce) requestAnimationFrame(loop);
  }

  function toNorm(e){
    var px = (e.touches?e.touches[0].clientX:e.clientX);
    var py = (e.touches?e.touches[0].clientY:e.clientY);
    light.tx = Math.min(0.9, Math.max(0.1, (px/window.innerWidth-0.5)*1.4 + 0.5));
    light.ty = Math.min(0.85, Math.max(0.12, (py/window.innerHeight-0.5)*1.2 + 0.5));
  }
  window.addEventListener("pointermove", toNorm, {passive:true});
  window.addEventListener("touchmove", toNorm, {passive:true});
  window.addEventListener("resize", resize);

  resize();
  light.tx = light.x; light.ty = light.y;
  if(reduce){ easeLight(); draw(); }
  else { requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
