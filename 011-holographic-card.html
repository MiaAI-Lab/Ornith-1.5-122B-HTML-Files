<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holographic Card — Iridescent Tilt</title>
<style>
  :root{
    --sans:"Segoe UI", system-ui, -apple-system, Helvetica, sans-serif;
    --serif:Georgia, "Times New Roman", serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(120% 120% at 30% 20%, #16171f 0%, #0a0b10 55%, #050507 100%);
    font-family:var(--sans); color:#e9e9f2; overflow:hidden; padding:40px 16px;
    -webkit-font-smoothing:antialiased;
  }
  /* ambient rainbow bloom behind the card */
  body::before{
    content:""; position:fixed; z-index:0; width:60vmax; height:60vmax; left:50%; top:46%;
    transform:translate(-50%,-50%); pointer-events:none; filter:blur(70px); opacity:.35;
    background:conic-gradient(from 90deg,#ff2d92,#ffbd2e,#2ee6a6,#2d9cff,#b02dff,#ff2d92);
    mix-blend-mode:screen; animation:spin 26s linear infinite;
  }

  .stage{
    position:relative; z-index:2;
    perspective:1400px;
    width:min(92vw,440px);
    aspect-ratio:1.72/1;
    margin-bottom:44px;
  }

  .card{
    position:relative; width:100%; height:100%;
    border-radius:18px;
    transform-style:preserve-3d;
    transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .7s cubic-bezier(.16,1,.3,1);
    will-change:transform;
    box-shadow:
      0 40px 80px -20px rgba(0,0,0,.8),
      0 0 0 1px rgba(255,255,255,.06) inset;
  }

  /* dark base with a soft metallic sheen */
  .card-bg{
    position:absolute; inset:0; border-radius:18px; overflow:hidden;
    background:
      linear-gradient(135deg,#14151d 0%, #0c0d14 45%, #1b1c28 100%);
  }
  .card-bg::after{
    content:""; position:absolute; inset:0; opacity:.5;
    background:radial-gradient(60% 60% at 20% 10%, rgba(120,120,160,.25), transparent 70%),
               radial-gradient(50% 50% at 90% 90%, rgba(90,90,130,.2), transparent 70%);
  }

  /* the iridescent rainbow foil — driven by JS transform */
  .foil{
    position:absolute; inset:-18%; border-radius:18px;
    background:conic-gradient(
      from 0deg at 50% 50%,
      #ff2d92 0deg, #ff6a3d 45deg, #ffbd2e 90deg, #b6ff2e 135deg,
      #2ee6a6 180deg, #2d9cff 225deg, #7b2dff 270deg, #ff2dd6 315deg, #ff2d92 360deg);
    mix-blend-mode:screen; opacity:.62; filter:saturate(1.2);
    transform:rotate(0deg) scale(1);
    transition:opacity .5s;
  }
  /* a second, finer interference layer for that true holographic banding */
  .foil2{
    position:absolute; inset:-18%; border-radius:18px;
    background:repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,.5) 0deg 3deg, transparent 3deg 12deg);
    mix-blend-mode:overlay; opacity:.25; filter:blur(.3px);
  }

  /* specular highlight that follows the cursor */
  .glare{
    position:absolute; inset:0; border-radius:18px; pointer-events:none;
    background:radial-gradient(26% 32% at var(--mx,50%) var(--my,50%),
      rgba(255,255,255,var(--glare,.0)) 0%, rgba(255,255,255,0) 60%);
    mix-blend-mode:screen;
    opacity:var(--glare-op,0);
    transition:opacity .5s;
  }

  /* embossed edges */
  .edge{
    position:absolute; inset:0; border-radius:18px; pointer-events:none;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.22), inset 0 -1px 2px rgba(0,0,0,.55);
    z-index:6;
  }

  .content{
    position:absolute; inset:0; padding:26px 28px; z-index:5;
    display:flex; flex-direction:column; justify-content:space-between;
    transform:translateZ(42px);
    text-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  .top{display:flex; justify-content:space-between; align-items:flex-start;}
  .brand{font-family:var(--serif); font-size:clamp(13px,2.6vw,17px); letter-spacing:.34em;
    text-transform:uppercase; font-weight:600;}
  .member{font-size:9px; letter-spacing:.3em; text-transform:uppercase; opacity:.75;}

  /* contactless icon */
  .contactless{width:30px; height:30px;}
  .contactless svg{width:100%;height:100%;stroke:#e9e9f2;fill:none;stroke-width:2.4;
    stroke-linecap:round;opacity:.9}

  /* the chip */
  .chip{
    width:46px; height:34px; border-radius:6px; margin-bottom:14px;
    background:linear-gradient(135deg,#f4e1a1,#c9a86a 55%,#8a6d34);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.5);
    position:relative; overflow:hidden;
  }
  .chip::before{content:""; position:absolute; inset:18% 20%; border:1px solid rgba(60,45,10,.55);
    border-radius:3px;}
  .chip::after{content:""; position:absolute; left:0; right:0; top:50%; height:1px;
    background:rgba(60,45,10,.45);}

  .number{
    font-family:var(--serif); font-size:clamp(17px,5vw,26px); letter-spacing:.14em;
    font-weight:600; margin-top:auto;
    text-shadow:0 1px 0 rgba(0,0,0,.55), 0 -1px 0 rgba(255,255,255,.14);
  }
  .bottom{display:flex; justify-content:space-between; align-items:flex-end; gap:12px;}
  .name{font-size:clamp(9px,2.2vw,12px); letter-spacing:.24em; text-transform:uppercase; opacity:.9;}
  .valid{font-size:9px; letter-spacing:.2em; text-transform:uppercase; opacity:.7;text-align:right;line-height:1.6}
  .valid b{display:block;font-size:clamp(11px,2.6vw,14px);letter-spacing:.12em;font-weight:600}

  .caption{
    position:relative; z-index:2; text-align:center; max-width:52ch;
  }
  .caption h1{font-family:var(--serif); font-weight:400; font-size:clamp(24px,5vw,44px);
    letter-spacing:.01em; line-height:1.05;}
  .caption p{margin-top:12px; font-size:12px; letter-spacing:.24em; text-transform:uppercase;
    color:#9a9ab0;}
  .caption .hint{margin-top:18px;font-size:11px;letter-spacing:.12em;color:#6d6d82}

  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @media(max-width:520px){ .caption h1{font-size:26px} }
</style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="card" id="card">
      <div class="card-bg"></div>
      <div class="foil" id="foil"></div>
      <div class="foil2"></div>
      <div class="glare" id="glare"></div>
      <div class="content">
        <div class="top">
          <div>
            <div class="brand">Aurora</div>
            <div class="member">Platinum · No. 0042</div>
          </div>
          <div class="contactless">
            <svg viewBox="0 0 24 24"><path d="M4 8.5a12 12 0 0 1 0 7M7.5 6a16 16 0 0 1 0 12M11 3.5a20 20 0 0 1 0 17"/></svg>
          </div>
        </div>
        <div class="chip"></div>
        <div class="bottom">
          <div>
            <div class="number">4921 · 1024 · 7788 · 0042</div>
            <div class="name">J. Meridian</div>
          </div>
          <div class="valid">Valid<br>thru<b>09 / 31</b></div>
        </div>
      </div>
      <div class="edge"></div>
    </div>
  </div>

  <div class="caption">
    <h1>The Holographic<br>Membership</h1>
    <p>Iridescent foil · 3D tilt · live specular</p>
    <div class="hint">Move your cursor across the card — it tilts, the rainbow sweeps, and the highlight follows.</div>
  </div>

  <script>
  (function(){
    "use strict";
    var card  = document.getElementById('card');
    var foil  = document.getElementById('foil');
    var glare = document.getElementById('glare');
    var stage = document.getElementById('stage');

    var MAX_TILT = 16;         // degrees
    var MAX_FOIL_ROT = 55;     // extra degrees the mouse can sweep the foil
    var target = { rx:0, ry:0, mx:0.5, my:0.5, glare:0 };
    var cur    = { rx:0, ry:0, mx:0.5, my:0.5, glare:0 };
    var spin = 0, hovering = false;

    function setRoot(){
      card.style.setProperty('--rx', cur.rx + 'deg');
      card.style.setProperty('--ry', cur.ry + 'deg');
      card.style.setProperty('--mx', cur.mx * 100 + '%');
      card.style.setProperty('--my', cur.my * 100 + '%');
      card.style.setProperty('--glare', cur.glare.toFixed(3));
      card.style.setProperty('--glare-op', (hovering ? cur.glare.toFixed(3) : '0'));
      foil.style.transform = 'rotate(' + (spin + (cur.mx-0.5)*2*MAX_FOIL_ROT) + 'deg) scale(1.25)';
    }

    function loop(){
      // ease toward target
      cur.rx  += (target.rx  - cur.rx)  * 0.08;
      cur.ry  += (target.ry  - cur.ry)  * 0.08;
      cur.mx  += (target.mx  - cur.mx)  * 0.08;
      cur.my  += (target.my  - cur.my)  * 0.08;
      cur.glare += (target.glare - cur.glare) * 0.08;
      spin += 0.25;                 // continuous slow holographic drift
      setRoot();
      requestAnimationFrame(loop);
    }

    function onMove(e){
      var r = stage.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width;   // 0..1
      var py = (e.clientY - r.top)  / r.height;  // 0..1
      px = Math.min(1, Math.max(0, px));
      py = Math.min(1, Math.max(0, py));
      target.mx = px; target.my = py;
      target.ry = (px - 0.5) * 2 * MAX_TILT;
      target.rx = -(py - 0.5) * 2 * MAX_TILT;
      target.glare = 0.9;
      hovering = true;
    }
    function onLeave(){
      target.rx = 0; target.ry = 0; target.glare = 0;
      target.mx = 0.5; target.my = 0.5;
      hovering = false;
    }

    stage.addEventListener('mousemove', onMove);
    stage.addEventListener('mouseleave', onLeave);
    stage.addEventListener('touchmove', function(e){
      if(e.touches[0]){
        var t = e.touches[0];
        onMove({clientX:t.clientX, clientY:t.clientY});
      }
    }, {passive:true});
    stage.addEventListener('touchend', onLeave);

    // boot
    setRoot();
    loop();
  })();
  </script>
</body>
</html>
