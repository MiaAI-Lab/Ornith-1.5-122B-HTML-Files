<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonlight — A Silver Night</title>
<style>
  :root{
    --silver:#dfe6f0;
    --deep:#0b1730;
    --mid:#17274a;
    --moon:#f4f2e8;
  }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--deep);}
  body{
    font-family:Georgia,'Times New Roman',serif;
    color:var(--silver);
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  .scene{position:fixed;inset:0;}
  canvas#night{position:absolute;inset:0;width:100%;height:100%;display:block;}

  .ui{
    position:absolute;inset:0;pointer-events:none;z-index:5;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(14px,3vw,32px) clamp(18px,4vw,48px);
  }
  .top,.bot{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  h1{
    margin:0;font-weight:400;font-style:italic;
    font-size:clamp(20px,3.4vw,44px);letter-spacing:.02em;
    text-shadow:0 2px 30px rgba(10,18,36,.8);
  }
  .sub{margin:8px 0 0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:10px;letter-spacing:.42em;text-transform:uppercase;opacity:.72;}
  .tag{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:10px;letter-spacing:.34em;text-transform:uppercase;
    border:1px solid rgba(223,230,240,.32);border-radius:999px;padding:7px 14px;
    background:rgba(9,15,30,.35);backdrop-filter:blur(5px);
  }
  .bot .hint{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.72;
    align-self:flex-end;display:flex;align-items:center;gap:9px;max-width:56%;
  }
  .ripple-ico{width:18px;height:18px;flex:none;}
  @media (max-width:640px){.tag,.bot .hint{max-width:none;}}
</style>
</head>
<body>
<div class="scene">
  <canvas id="night"></canvas>
</div>
<div class="ui">
  <div class="top">
    <div>
      <h1>Moonlight</h1>
      <p class="sub">A Silver Night Over Still Water</p>
    </div>
    <span class="tag">Nocturne №099</span>
  </div>
  <div class="bot">
    <span class="hint">
      <svg class="ripple-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M5 12a7 7 0 0 1 14 0M2 12a10 10 0 0 1 20 0"/></svg>
      Tap the water to send a ripple across the lake
    </span>
  </div>
</div>
<script>
(function(){
  "use strict";
  var canvas=document.getElementById("night");
  var ctx=canvas.getContext("2d");
  var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  var horizon=0;
  var stars=[];
  var ripples=[];
  var mist=[
    {x:0,y:0,r:1,sp:6,a:0.5},
    {x:W,y:0,r:1.3,sp:-4,a:0.4},
    {x:W*0.4,y:0,r:1.1,sp:3,a:0.35}
  ];
  var t0=performance.now();

  function resize(){
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+"px";canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    horizon=H*0.54;
    buildStars();
    for(var i=0;i<mist.length;i++){mist[i].r=30+Math.random()*60;}
  }

  function buildStars(){
    stars=[];
    var n=Math.round(Math.min(W*H/3600,260));
    for(var i=0;i<n;i++){
      var y=Math.random()*horizon;
      stars.push({
        x:Math.random()*W,
        y:y,
        r:Math.random()*1.3+0.2,
        tw:Math.random()*Math.PI*2,
        sp:0.6+Math.random()*2.2,
        base:0.35+Math.random()*0.55
      });
    }
  }

  function addRipple(x,y){
    ripples.push({x:x,y:y,r:2,life:0,max:85});
    if(ripples.length>14)ripples.shift();
  }

  function drawSky(t){
    var g=ctx.createLinearGradient(0,0,0,horizon);
    g.addColorStop(0,"#060d20");
    g.addColorStop(0.5,"#0d1c3a");
    g.addColorStop(1,"#26406e");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,horizon);
  }

  function drawStars(t){
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var tw=0.55+0.45*Math.sin(t*0.001*s.sp+s.tw);
      var a=s.base*tw;
      ctx.beginPath();
      ctx.fillStyle="rgba(230,236,250,"+a+")";
      ctx.arc(s.x,s.y,s.r,0,6.2832);ctx.fill();
      if(s.r>1.1){
        ctx.save();
        ctx.globalAlpha=a*0.5;
        ctx.strokeStyle="rgba(230,236,250,0.5)";ctx.lineWidth=0.6;
        ctx.beginPath();
        ctx.moveTo(s.x-s.r*3,s.y);ctx.lineTo(s.x+s.r*3,s.y);
        ctx.moveTo(s.x,s.y-s.r*3);ctx.lineTo(s.x,s.y+s.r*3);
        ctx.stroke();ctx.restore();
      }
    }
  }

  // distant hills silhouette
  function drawHills(){
    ctx.fillStyle="#0a1526";
    ctx.beginPath();
    ctx.moveTo(0,horizon);
    var pts=[[0,0.0],[0.12,-0.05],[0.24,-0.02],[0.36,-0.09],[0.5,-0.04],[0.64,-0.11],
             [0.78,-0.05],[0.9,-0.08],[1.0,-0.03]];
    for(var i=0;i<pts.length;i++){
      ctx.lineTo(W*pts[i][0], horizon+pts[i][1]*H*0.12);
    }
    ctx.lineTo(W,horizon);ctx.closePath();ctx.fill();
  }

  // moon with pulsing halo
  function drawMoon(t){
    var mx=W*0.7, my=H*0.26, r=Math.min(W,H)*0.075;
    var pulse=0.5+0.5*Math.sin(t*0.0008);
    // wide halo
    var h3=ctx.createRadialGradient(mx,my,r*0.6,mx,my,r*(4.2+pulse*0.6));
    h3.addColorStop(0,"rgba(240,242,228,"+(0.28+pulse*0.12)+")");
    h3.addColorStop(0.4,"rgba(200,210,235,0.10)");
    h3.addColorStop(1,"rgba(200,210,235,0)");
    ctx.fillStyle=h3;ctx.beginPath();ctx.arc(mx,my,r*(4.2+pulse*0.6),0,6.2832);ctx.fill();
    // inner glow
    var h2=ctx.createRadialGradient(mx,my,r*0.2,mx,my,r*1.7);
    h2.addColorStop(0,"rgba(255,255,248,0.95)");
    h2.addColorStop(1,"rgba(255,255,248,0)");
    ctx.fillStyle=h2;ctx.beginPath();ctx.arc(mx,my,r*1.7,0,6.2832);ctx.fill();
    // disc
    var disc=ctx.createRadialGradient(mx-r*0.25,my-r*0.25,r*0.1,mx,my,r);
    disc.addColorStop(0,"#fbfaf2");
    disc.addColorStop(0.7,"#ece7d6");
    disc.addColorStop(1,"#d8d2bf");
    ctx.fillStyle=disc;ctx.beginPath();ctx.arc(mx,my,r,0,6.2832);ctx.fill();
    // faint craters
    ctx.save();ctx.beginPath();ctx.arc(mx,my,r,0,6.2832);ctx.clip();
    ctx.fillStyle="rgba(180,174,158,0.28)";
    var cr=[[0.28,0.1,0.16],[-0.2,0.32,0.1],[0.1,0.38,0.07],[-0.35,-0.1,0.09]];
    for(var i=0;i<cr.length;i++){
      ctx.beginPath();ctx.arc(mx+cr[i][0]*r,my+cr[i][1]*r,r*cr[i][2],0,6.2832);ctx.fill();
    }
    ctx.restore();
    return {mx:mx,my:my,r:r};
  }

  function drawWater(t,moon){
    var g=ctx.createLinearGradient(0,horizon,0,H);
    g.addColorStop(0,"#2a4170");
    g.addColorStop(0.3,"#16284c");
    g.addColorStop(1,"#070f22");
    ctx.fillStyle=g;ctx.fillRect(0,horizon,W,H-horizon);

    // moon reflection column — shimmering broken streaks
    var cx=moon.mx;
    for(var y=horizon+6;y<H;y+=4){
      var depth=(y-horizon)/(H-horizon);
      var wob=Math.sin(t*0.002 + y*0.05 + cx*0.02)* (3+depth*14);
      var w=2+depth*10;
      var a=(0.5*(1-depth))*(0.7+0.3*Math.sin(t*0.003+y*0.3));
      ctx.fillStyle="rgba(240,242,228,"+ (a*0.6)+")";
      ctx.fillRect(cx+wob-w/2, y, w, 2.4);
    }

    // gentle surface waves — horizontal silver ripples
    for(var y=horizon+14;y<H;y+=10){
      var depth=(y-horizon)/(H-horizon);
      var amp=0.6+depth*1.6;
      ctx.beginPath();
      ctx.strokeStyle="rgba(210,218,238,"+(0.05+depth*0.06)+")";
      ctx.lineWidth=1;
      for(var x=0;x<=W;x+=14){
        var yy=y+Math.sin(t*0.0016 + x*0.012 + y*0.03)*amp;
        if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);
      }
      ctx.stroke();
    }

    // user ripples
    for(var i=ripples.length-1;i>=0;i--){
      var rp=ripples[i];
      rp.life++;rp.r=2+rp.life*3.2;
      var a=(1-rp.life/rp.max)*0.5;
      if(a<=0){ripples.splice(i,1);continue;}
      ctx.strokeStyle="rgba(220,228,245,"+a+")";ctx.lineWidth=1.4;
      ctx.beginPath();
      // flatten ripple vertically to sit on water perspective
      ctx.ellipse(rp.x,rp.y,rp.r,rp.r*0.35,0,0,6.2832);ctx.stroke();
    }
  }

  function drawMist(t){
    for(var i=0;i<mist.length;i++){
      var m=mist[i];
      m.x+=m.sp*0.016;
      if(m.x>W+300)m.x=-300; if(m.x<-300)m.x=W+300;
      var y=horizon-10+Math.sin(t*0.0005+i)*14;
      var rg=ctx.createRadialGradient(m.x,y,10,m.x,y,m.r*40);
      rg.addColorStop(0,"rgba(200,210,232,"+(m.a*0.28)+")");
      rg.addColorStop(1,"rgba(200,210,232,0)");
      ctx.fillStyle=rg;
      ctx.beginPath();ctx.arc(m.x,y,m.r*40,0,6.2832);ctx.fill();
    }
  }

  function frame(now){
    var t=now-t0;
    ctx.clearRect(0,0,W,H);
    drawSky(t);
    drawStars(t);
    var mp=drawMoon(t);
    drawHills();
    drawWater(t,mp);
    drawMist(t);
    requestAnimationFrame(frame);
  }

  function pointer(e){
    var rect=canvas.getBoundingClientRect();
    var cx=(e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX)-rect.left;
    var cy=(e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY)-rect.top;
    if(cy>horizon)addRipple(cx,cy);
  }
  canvas.addEventListener("pointerdown",pointer);
  window.addEventListener("resize",resize);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
