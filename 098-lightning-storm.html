<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightning Storm</title>
<style>
  :root{
    --ink:#0a0b10;
    --storm:#2a2d38;
    --violet:#b9a7ff;
    --white:#f4f6ff;
  }
  html,body{height:100%;margin:0;overflow:hidden;background:#0a0b10;}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:#e9ecf5;
    cursor:crosshair;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  .scene{position:fixed;inset:0;}
  canvas#sky{position:absolute;inset:0;width:100%;height:100%;display:block;}

  /* drifting storm clouds above the canvas */
  .clouds{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .cloud{
    position:absolute;border-radius:50%;
    background:radial-gradient(closest-side, rgba(64,68,86,.9), rgba(42,45,56,.5) 60%, rgba(42,45,56,0) 72%);
    filter:blur(6px);
    will-change:transform;
  }
  .c1{width:52vw;height:30vw;top:-4vw;left:-8vw;animation:drift1 46s linear infinite;}
  .c2{width:60vw;height:34vw;top:2vw;left:30vw;animation:drift2 62s linear infinite;}
  .c3{width:44vw;height:26vw;top:-2vw;left:60vw;animation:drift1 54s linear infinite;animation-delay:-20s;}
  .c4{width:70vw;height:38vw;top:6vw;left:-20vw;animation:drift2 78s linear infinite;animation-delay:-30s;}
  @keyframes drift1{from{transform:translateX(0);}to{transform:translateX(120vw);}}
  @keyframes drift2{from{transform:translateX(0);}to{transform:translateX(-120vw);}}

  /* flash overlay */
  .flash{
    position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(120% 100% at 50% 0%, rgba(244,246,255,.95) 0%, rgba(185,167,255,.35) 38%, rgba(120,120,180,0) 70%);
    mix-blend-mode:screen;
  }

  /* vignette + grain for a photographic storm feel */
  .vignette{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 40%, rgba(0,0,0,0) 55%, rgba(5,6,10,.72) 100%);
  }

  .ui{
    position:absolute;inset:0;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(14px,3vw,30px) clamp(16px,4vw,44px);
    z-index:6;
  }
  .top,.bot{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  h1{
    margin:0;font-weight:600;font-size:clamp(16px,2.2vw,28px);
    letter-spacing:.34em;text-transform:uppercase;text-shadow:0 2px 20px rgba(0,0,0,.6);
  }
  .sub{margin:6px 0 0;font-size:10px;letter-spacing:.32em;text-transform:uppercase;opacity:.72;}
  .tag{
    font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    border:1px solid rgba(185,167,255,.4);border-radius:999px;padding:7px 13px;
    background:rgba(10,11,16,.35);backdrop-filter:blur(4px);
  }
  .readout{
    font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.15em;
    background:rgba(10,11,16,.35);border:1px solid rgba(255,255,255,.08);
    border-radius:10px;padding:10px 14px;backdrop-filter:blur(4px);line-height:1.7;
  }
  .readout b{color:var(--violet);font-weight:600;}
  .bot .hint{
    font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:.7;
    align-self:flex-end;display:flex;align-items:center;gap:8px;max-width:60%;
  }
  .bolt-ico{width:16px;height:16px;flex:none;}
  @media (max-width:640px){.tag,.readout .big{display:none;}.bot .hint{max-width:none;}}
  @media (prefers-reduced-motion:reduce){.cloud{animation:none;}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <canvas id="sky"></canvas>
  <div class="clouds">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="vignette"></div>
</div>

<div class="ui">
  <div class="top">
    <div>
      <h1>Supercell</h1>
      <p class="sub">Branching Discharge · Click Anywhere to Strike</p>
    </div>
    <span class="tag">Storm №098</span>
  </div>
  <div class="bot">
    <div class="readout">
      <div>STRIKES&nbsp;&nbsp;<b class="big" id="count">00</b></div>
      <div>NEXT&nbsp;&nbsp;<b id="next">--</b>s</div>
    </div>
    <p class="hint">
      <svg class="bolt-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>
      Tap the sky to summon a bolt — sound on with first touch
    </p>
  </div>
</div>
<script>
(function(){
  "use strict";
  var canvas=document.getElementById("sky");
  var ctx=canvas.getContext("2d");
  var flash=document.getElementById("flash");
  var countEl=document.getElementById("count");
  var nextEl=document.getElementById("next");
  var scene=document.getElementById("scene");

  var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  var rain=[];
  var bolts=[];
  var strikes=0;
  var shake=0;
  var flashLife=0;

  function resize(){
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+"px";canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildRain();
  }

  function buildRain(){
    rain=[];
    var n=Math.round(Math.min(W*H/9000,260));
    for(var i=0;i<n;i++){
      rain.push({
        x:Math.random()*W,
        y:Math.random()*H,
        len:10+Math.random()*22,
        sp:7+Math.random()*9,
        a:0.06+Math.random()*0.14
      });
    }
  }

  // ---- midpoint-displacement lightning polyline ----
  function genBolt(x0,y0,x1,y1,displacement,detail){
    var pts=[[x0,y0],[x1,y1]];
    var d=displacement;
    while(d>detail){
      for(var i=pts.length-1;i>0;i--){
        var ax=pts[i-1][0],ay=pts[i-1][1],bx=pts[i][0],by=pts[i][1];
        var mx=(ax+bx)/2,my=(ay+by)/2;
        var dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy)||1;
        var off=(Math.random()-0.5)*d;
        pts.splice(i,0,[mx+(-dy/len)*off, my+(dx/len)*off]);
      }
      d*=0.5;
    }
    return pts;
  }

  function makeBolt(x0,y0,x1,y1){
    var disp=Math.min(W,H)*0.28;
    var main=genBolt(x0,y0,x1,y1,disp,6);
    var segs=[main];
    var branches=0;
    for(var i=3;i<main.length-1;i++){
      if(Math.random()<0.11){
        var p=main[i];
        var ang=Math.atan2(y1-y0,x1-x0)+(Math.random()<0.5?-1:1)*(0.5+Math.random()*0.9);
        var len=40+Math.random()*Math.min(W,H)*0.22;
        var ex=p[0]+Math.cos(ang)*len;
        var ey=p[1]+Math.sin(ang)*len;
        segs.push(genBolt(p[0],p[1],ex,ey,disp*0.45,8));
        branches++;
      }
    }
    return {
      segs:segs,
      life:0,
      maxLife:9+Math.random()*10,
      flick:0.6+Math.random()*0.4,
      y0:y0,
      branches:branches
    };
  }

  function strikeAt(tx,ty){
    // one or two bolts from the top edge down toward the target
    var n=1+(Math.random()<0.35?1:0);
    for(var i=0;i<n;i++){
      var sx=(tx||W*Math.random())+(Math.random()-0.5)*120;
      var sy=-10;
      var ex=(tx!=null?tx:W*Math.random())+(Math.random()-0.5)*40;
      var ey=(ty!=null?ty:H*(0.55+Math.random()*0.4));
      bolts.push(makeBolt(sx,sy,ex,ey));
    }
    strikes++;
    countEl.textContent=("0"+strikes).slice(-2);
    // distance from top-center decides flash + shake intensity
    var closeness=1-Math.min(1,(ty||0)/H);
    triggerFlash(0.35+closeness*0.55);
    shake=Math.min(18,6+closeness*16);
    rumble(closeness);
  }

  // ---- flash + shake ----
  function triggerFlash(op){
    flashLife=op;
  }
  function draw(){
    ctx.clearRect(0,0,W,H);

    // storm sky gradient
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#2c3040");
    g.addColorStop(0.45,"#232632");
    g.addColorStop(1,"#0d0f16");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    // distant horizon glow
    var hg=ctx.createRadialGradient(W*0.5,H*1.05,10,W*0.5,H*1.05,W*0.9);
    hg.addColorStop(0,"rgba(120,110,170,0.22)");
    hg.addColorStop(1,"rgba(120,110,170,0)");
    ctx.fillStyle=hg;ctx.fillRect(0,0,W,H);

    // rain
    ctx.lineCap="round";
    for(var i=0;i<rain.length;i++){
      var r=rain[i];
      ctx.strokeStyle="rgba(190,200,230,"+r.a+")";
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(r.x,r.y);
      ctx.lineTo(r.x-2.4,r.y+r.len);
      ctx.stroke();
      r.y+=r.sp;r.x-=r.sp*0.16;
      if(r.y>H){r.y=-r.len;r.x=Math.random()*W;}
    }

    // bolts (glow passes + core)
    for(var b=bolts.length-1;b>=0;b--){
      var bolt=bolts[b];
      bolt.life++;
      var t=bolt.life/bolt.maxLife;
      var fade=(1-t)*bolt.flick*(0.7+0.3*Math.abs(Math.sin(bolt.life*0.9)));
      if(fade<=0.02){bolts.splice(b,1);continue;}
      var J=ctx;
      for(var s=0;s<bolt.segs.length;s++){
        var p=bolt.segs[s];
        // outer violet glow
        J.save();
        J.strokeStyle="rgba(150,120,255,"+(fade*0.32)+")";
        J.lineWidth=7;J.shadowColor="rgba(150,120,255,0.9)";J.shadowBlur=26;
        J.beginPath();J.moveTo(p[0][0],p[0][1]);
        for(var k=1;k<p.length;k++)J.lineTo(p[k][0],p[k][1]);
        J.stroke();J.restore();
        // mid
        J.strokeStyle="rgba(214,205,255,"+(fade*0.8)+")";
        J.lineWidth=2.6;J.shadowColor="rgba(230,220,255,1)";J.shadowBlur=12;
        J.beginPath();J.moveTo(p[0][0],p[0][1]);
        for(var k=1;k<p.length;k++)J.lineTo(p[k][0],p[k][1]);
        J.stroke();
        // hot white core
        J.strokeStyle="rgba(255,255,255,"+fade+")";
        J.lineWidth=1.1;J.shadowBlur=0;
        J.beginPath();J.moveTo(p[0][0],p[0][1]);
        for(var k=1;k<p.length;k++)J.lineTo(p[k][0],p[k][1]);
        J.stroke();
      }
    }

    // flash fade
    if(flashLife>0){
      flash.style.opacity=flashLife.toFixed(3);
      flashLife-=0.06;
    }else{
      flash.style.opacity=0;
    }
    // shake decay
    if(shake>0.1){
      var sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
      scene.style.transform="translate("+sx+"px,"+sy+"px)";
      shake*=0.86;
    }else{
      shake=0;scene.style.transform="";
    }
  }

  function loop(){
    draw();
    requestAnimationFrame(loop);
  }

  // ---- auto strike scheduler ----
  var nextIn=2.2;
  var last=performance.now();
  function sched(dt){
    nextIn-=dt;
    if(nextIn<=0){
      strikeAt(null,null);
      nextIn=1.3+Math.random()*3.2;
    }
    nextEl.textContent=nextIn.toFixed(1);
  }
  function raf(t){
    var dt=(t-last)/1000;last=t;
    if(dt<0.1)sched(dt);
    requestAnimationFrame(raf);
  }

  // ---- synthesized thunder (WebAudio, first gesture) ----
  var ac=null;
  function ensureAudio(){
    if(ac)return;
    try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}
  }
  function rumble(closeness){
    if(!ac)return;
    var now=ac.currentTime;
    var master=ac.createGain();
    master.gain.value=0;
    master.connect(ac.destination);
    // low body
    var osc=ac.createOscillator();
    osc.type="sine";
    osc.frequency.setValueAtTime(42+closeness*26,now);
    osc.frequency.exponentialRampToValueAtTime(28,now+1.2);
    var og=ac.createGain();
    og.gain.setValueAtTime(0.0001,now);
    og.gain.exponentialRampToValueAtTime((0.15+closeness*0.4),now+0.04);
    og.gain.exponentialRampToValueAtTime(0.0001,now+1.4-closeness*0.5);
    osc.connect(og).connect(master);
    // filtered noise crackle
    var bs=Math.floor(ac.sampleRate*1.6);
    var buf=ac.createBuffer(1,bs,ac.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<bs;i++)d[i]=(Math.random()*2-1);
    var noise=ac.createBufferSource();noise.buffer=buf;
    var lp=ac.createBiquadFilter();lp.type="lowpass";
    lp.frequency.setValueAtTime(1200,now);
    lp.frequency.exponentialRampToValueAtTime(220,now+1.1);
    var ng=ac.createGain();
    ng.gain.setValueAtTime(0.0001,now);
    ng.gain.exponentialRampToValueAtTime((0.2+closeness*0.5),now+0.02+closeness*0.05);
    ng.gain.exponentialRampToValueAtTime(0.0001,now+1.6-closeness*0.6);
    noise.connect(lp).connect(ng).connect(master);
    master.gain.setValueAtTime(0.0001,now);
    master.gain.exponentialRampToValueAtTime(0.6,now+0.03);
    master.gain.exponentialRampToValueAtTime(0.0001,now+1.8);
    osc.start(now);noise.start(now);
    osc.stop(now+2);noise.stop(now+2);
  }

  // ---- input ----
  function pointerStrike(e){
    ensureAudio();
    if(ac&&ac.state==="suspended")ac.resume();
    var rect=canvas.getBoundingClientRect();
    var cx=(e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX)-rect.left;
    var cy=(e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY)-rect.top;
    strikeAt(cx,cy);
  }
  canvas.addEventListener("pointerdown",pointerStrike);
  window.addEventListener("touchstart",pointerStrike,{passive:true});
  window.addEventListener("resize",resize);

  // init
  resize();
  requestAnimationFrame(loop);
  requestAnimationFrame(raf);
  nextEl.textContent=nextIn.toFixed(1);
})();
</script>
</body>
</html>
