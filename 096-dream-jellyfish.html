<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somnium — the Dreaming Jellyfish</title>
<style>
  :root{
    --violet:#7c4bd8; --violet-deep:#4a2c8f; --violet-glow:#a877ff;
    --peach:#ff9e7a; --peach-soft:#ffc2a8;
    --cyan:#5fe0ee; --cyan-soft:#a8f4ff;
    --ink:#f6ecff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink); overflow:hidden; position:fixed; inset:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(125% 105% at 50% 8%, #2a1a55 0%, #241650 26%, #1a1140 55%, #120a33 100%);
  }
  /* dream haze + vignette overlays */
  .haze{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60% 46% at 72% 22%, rgba(255,158,122,.20), transparent 60%),
      radial-gradient(54% 44% at 24% 70%, rgba(95,224,235,.16), transparent 62%),
      radial-gradient(70% 60% at 50% 100%, rgba(124,75,216,.28), transparent 66%);
    mix-blend-mode:screen; filter:saturate(1.15);
  }
  .vignette{ position:fixed; inset:0; z-index:0; pointer-events:none;
    box-shadow:inset 0 0 90px rgba(8,4,26,.75); }
  #scene{ position:fixed; inset:0; z-index:1; display:block; }

  .ui{ position:fixed; inset:0; z-index:2; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:clamp(20px,4.4vw,54px) clamp(20px,5vw,64px);
    text-shadow:0 2px 30px rgba(40,10,70,.6); }
  .top{ display:flex; flex-direction:column; gap:12px; max-width:640px; }
  .eyebrow{ font-size:.72rem; letter-spacing:.44em; text-transform:uppercase;
    color:var(--cyan-soft); font-weight:600; opacity:.92; }
  h1{ margin:0; font-family:Georgia,"Times New Roman",serif; font-weight:500;
    font-size:clamp(2.4rem,7vw,5.4rem); line-height:.96; letter-spacing:-.01em;
    background:linear-gradient(180deg,#fff7ff 0%, var(--peach-soft) 42%, var(--violet-glow) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 34px rgba(168,119,255,.45)); }
  .sub{ margin:0; max-width:44ch; color:rgba(246,236,255,.82);
    font-size:clamp(.9rem,1.9vw,1.12rem); line-height:1.5; font-weight:400; }
  .sub em{ color:var(--peach-soft); font-style:italic; }

  .bottom{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .hint{ display:flex; align-items:center; gap:12px; color:rgba(246,236,255,.72);
    font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; }
  .hint .dot{ width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--cyan));
    box-shadow:0 0 14px var(--cyan),0 0 4px #fff; animation:breathe 3.4s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:.4; transform:scale(.8);} 50%{ opacity:1; transform:scale(1.25);} }
  .credit{ color:rgba(246,236,255,.5); font-size:.7rem; letter-spacing:.3em;
    text-transform:uppercase; }
  @media (max-width:560px){
    .credit{ display:none; }
    .sub{ font-size:.92rem; }
  }
  @media (prefers-reduced-motion:reduce){ .hint .dot{ animation:none; } }
</style>
</head>
<body>
  <canvas id="scene" aria-label="A surreal dreaming jellyfish with extremely long flowing tentacles drifting through soft bokeh light"></canvas>
  <div class="haze"></div>
  <div class="vignette"></div>
  <div class="ui">
    <div class="top">
      <div class="eyebrow">Dream Fauna · No. 096</div>
      <h1>Somnium</h1>
      <p class="sub">A jellyfish made of <em>vapor and half-remembered light</em> — bell pulsing, ten thousand tentacles of thread drifting through a sea of out-of-focus stars. Move to look around. Tap to make it breathe.</p>
    </div>
    <div class="bottom">
      <div class="hint"><span class="dot"></span><span>drift · move pointer</span><span aria-hidden="true">·</span><span>tap to pulse</span></div>
      <div class="credit">Orthin Light Lab — Oneiric Series</div>
    </div>
  </div>
<script>
(function(){
  "use strict";

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  var reduce = false;
  try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}

  var W=0, H=0, DPR=1;
  var pointer = {x:0.5, y:0.5}, smooth = {x:0.5, y:0.5};
  var pulseFlash = 0;      // decays after a tap -> extra contraction + bloom
  var ripples = [];        // expanding tap rings
  var T = 0;               // animated time (scaled by motion)

  /* ---- palette (pre-built rgba prefixes) ---- */
  var C = {
    violetA:"rgba(138,75,216,", violetB:"rgba(92,52,180,", violetC:"rgba(168,119,255,",
    peachA: "rgba(255,158,122,", peachB: "rgba(255,196,168,",
    cyanA:  "rgba(95,224,235,",  cyanB: "rgba(168,244,255,",
    white:  "rgba(255,247,255,"
  };
  var BOKEH_COLORS = [C.peachA, C.cyanA, C.violetC, C.white, C.peachB, C.cyanB];

  /* ---- bokeh field ---- */
  var bokeh = [];
  function buildBokeh(){
    var area = W*H;
    var count = Math.round(Math.max(26, Math.min(90, area/16000)));
    bokeh = [];
    for(var i=0;i<count;i++){
      bokeh.push({
        x: Math.random(), y: Math.random(),
        r: 6 + Math.random()*64,
        depth: 0.35 + Math.random(),          // parallax weight + apparent size class
        color: BOKEH_COLORS[(Math.random()*BOKEH_COLORS.length)|0],
        phase: Math.random()*Math.PI*2,
        tw: 0.4 + Math.random()*1.6,          // twinkle speed
        ring: Math.random()<0.34,             // some are hollow bokeh rings
        drift: 0.6 + Math.random()*1.6
      });
    }
  }

  /* ---- jellyfish state ---- */
  var JF = { cx:0, cy:0, baseW:0, baseH:0, ang:0, driftPhase:0 };
  function initJelly(){
    var s = Math.min(W, H);
    JF.baseW = s*0.165;
    JF.baseH = s*0.135;
    JF.cx = W*0.5;
    JF.cy = H*0.44;
    // build tentacles
    TENT = [];
    var n = W < 560 ? 26 : 40;
    for(var i=0;i<n;i++){
      var f = n===1?0.5:i/(n-1);                 // 0..1 across the rim
      var side = (f-0.5)*2;                       // -1..1
      TENT.push({
        f: f,
        side: side,
        len: (0.85 + Math.random()*1.15) * H*0.55, // extremely long
        phase: Math.random()*Math.PI*2,
        sway: 0.6 + Math.random()*0.9,
        width: 1.4 + Math.random()*2.6,
        hue: Math.random(),                        // peach<->cyan<->violet tint
        seg: 46 + ((Math.random()*24)|0),
        curl: 0.5 + Math.random()*1.1,
        oral: f>0.32 && f<0.68                       // central ones are oral arms
      });
    }
    FRINGE = [];
    var fn = 60;
    for(var j=0;j<fn;j++){
      FRINGE.push({ f: fn===1?0.5:j/(fn-1), len: 8+Math.random()*22, ph: Math.random()*6.28, sp: 1+Math.random()*2 });
    }
  }
  var TENT=[], FRINGE=[];

  /* ---- sizing ---- */
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W*DPR);
    canvas.height = Math.floor(H*DPR);
    canvas.style.width = W+"px";
    canvas.style.height = H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildBokeh();
    initJelly();
  }

  /* ---- input ---- */
  function onMove(px, py){ pointer.x = px/window.innerWidth; pointer.y = py/window.innerHeight; }
  window.addEventListener("mousemove", function(e){ onMove(e.clientX, e.clientY); }, {passive:true});
  window.addEventListener("touchmove", function(e){ if(e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  function tap(){
    pulseFlash = 1;
    ripples.push({ r: JF.baseW*0.6, max: JF.baseW*4.2, a: 0.7, x: JF.cx, y: JF.cy });
  }
  window.addEventListener("mousedown", tap);
  window.addEventListener("touchstart", function(e){ if(e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY); tap(); }, {passive:true});
  /* ================= DRAWING ================= */

  function drawBokeh(){
    var px = (smooth.x-0.5), py = (smooth.y-0.5);
    var bloom = pulseFlash*0.5;
    for(var i=0;i<bokeh.length;i++){
      var b = bokeh[i];
      var d = b.depth;
      var dx = px * (26 + d*70);
      var dy = py * (20 + d*56) + Math.sin(T*0.22*b.drift + b.phase)*14;
      var cx = b.x*W + dx;
      var cy = b.y*H + dy;
      var tw = 0.5 + 0.5*Math.sin(T*b.tw + b.phase);
      var rr = b.r * (0.9 + tw*0.25);
      var baseA = (0.06 + d*0.13) * (0.55 + tw*0.45) + bloom*0.12;
      var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
      if(b.ring){
        // hollow bokeh disc: bright rim, soft hollow centre
        g.addColorStop(0, b.color+(baseA*0.15)+")");
        g.addColorStop(0.62, b.color+(baseA*0.1)+")");
        g.addColorStop(0.82, b.color+(baseA*0.95)+")");
        g.addColorStop(1, b.color+"0)")
      }else{
        g.addColorStop(0, b.color+(baseA*1.2)+")");
        g.addColorStop(0.45, b.color+(baseA*0.6)+")");
        g.addColorStop(1, b.color+"0)");
      }
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, 6.2832);
      ctx.fill();
    }
  }

  /* ---- bell geometry: returns rim points + scales ---- */
  function bellScales(){
    // beat  ~ one contraction every beatPeriod seconds, shaped as a quick pulse
    var beatPeriod = reduce ? 999999 : 3.1;
    var beat = T / beatPeriod;
    var s = beat*Math.PI*2;
    var beatEnv = 0.5-0.5*Math.cos(s);                 // 0..1..0
    var contract = Math.pow(1-beatEnv, 2.4);           // sharp squeeze at power stroke
    contract = Math.max(0, contract) + pulseFlash*0.6; // tap adds a hard contraction
    var widen = 1 + 0.08*contract;
    var squash = 1 - 0.17*contract;
    return { contract:contract, widen:widen, squash:squash };
  }

  // Build the bell outline path (dome + scalloped skirt). Returns rim sample fn data.
  function buildBell(w, h, skirtdrop){
    // right rim (cx+w, cy) -> dome over top -> left rim -> scalloped skirt back
    var pts = [];
    var cx=JF.cx, cy=JF.cy;
    // dome: sample a smooth arc with gentle lobes
    var dome = 34;
    for(var i=0;i<=dome;i++){
      var u = i/dome;                       // 0 right -> 1 left
      var ang = Math.PI*u;                  // 0..pi
      var lelob = 1 + 0.03*Math.sin(u*13);  // subtle scallop on shell
      var x = cx + Math.cos(ang)*w*lelob;   // cos(0)=1 right, cos(pi)=-1 left
      var y = cy - Math.sin(ang)*h;         // dome arch
      pts.push({x:x, y:y, u:u});
    }
    // scalloped skirt from left rim back to right rim (bulging downward)
    var lobes = 11;
    var startIdx = pts.length;
    for(var k=1;k<=lobes;k++){
      var v0=k-1, v1=k;
      var x0 = cx - w + (2*w)*(v0/lobes);
      var x1 = cx - w + (2*w)*(v1/lobes);
      var midx = (x0+x1)/2;
      var dip = cy + skirtdrop*(0.85 + 0.15*Math.sin(k*1.7));
      pts.push({x:x0, y:cy, _mid:{x:midx, y:dip}});
    }
    pts.push({x: cx+w, y: cy});
    return {pts:pts, cx:cx, cy:cy, w:w, h:h};
  }

  function traceBell(bell){
    var p = bell.pts;
    ctx.beginPath();
    ctx.moveTo(p[0].x, p[0].y);
    for(var i=1;i<p.length;i++){
      var q = p[i];
      if(q._mid){
        ctx.quadraticCurveTo(q._mid.x, q._mid.y, q.x, q.y);
      }else{
        ctx.lineTo(q.x, q.y);
      }
    }
    ctx.closePath();
  }

  function drawBellBody(bell, sc){
    var cx=bell.cx, cy=bell.cy, w=bell.w, h=bell.h;
    var glowR = Math.max(w,h)*2.1;
    // outer halo
    var halo = ctx.createRadialGradient(cx, cy-h*0.25, w*0.1, cx, cy-h*0.2, glowR);
    halo.addColorStop(0, C.violetC+(0.30 + sc.contract*0.25)+")");
    halo.addColorStop(0.4, C.violetA+"0.10)");
    halo.addColorStop(1, C.violetA+"0)");
    ctx.globalCompositeOperation="lighter";
    ctx.fillStyle=halo;
    ctx.beginPath(); ctx.arc(cx, cy-h*0.2, glowR, 0, 6.2832); ctx.fill();
    ctx.globalCompositeOperation="source-over";

    // bell body gradient
    traceBell(bell);
    var bg = ctx.createRadialGradient(cx, cy-h*0.55, w*0.05, cx, cy-h*0.1, w*1.35);
    bg.addColorStop(0,   C.white+"0.62)");
    bg.addColorStop(0.18,C.peachB+"0.55)");
    bg.addColorStop(0.42,C.cyanB+"0.40)");
    bg.addColorStop(0.7, C.violetA+"0.34)");
    bg.addColorStop(0.9, C.violetB+"0.26)");
    bg.addColorStop(1,   C.violetB+"0.10)");
    ctx.fillStyle=bg;
    ctx.globalAlpha=0.92;
    ctx.fill();
    ctx.globalAlpha=1;

    // luminous rim edge
    traceBell(bell);
    ctx.strokeStyle= C.cyanB+"0.55)";
    ctx.lineWidth=1.4;
    ctx.shadowColor= C.cyanA+"0.9)";
    ctx.shadowBlur=16;
    ctx.stroke();
    ctx.shadowBlur=0;

    // inner top highlight (wet glass sheen)
    ctx.beginPath();
    ctx.ellipse(cx, cy-h*0.62, w*0.42, h*0.30, 0, 0, 6.2832);
    var hs = ctx.createRadialGradient(cx, cy-h*0.62, 0, cx, cy-h*0.62, w*0.5);
    hs.addColorStop(0, C.white+"0.5)");
    hs.addColorStop(1, C.white+"0)");
    ctx.fillStyle=hs; ctx.fill();
  }

  function drawGonads(h){
    // four soft dreamy gonad blobs under the dome (stylised, not anatomical)
    var cx=JF.cx, cy=JF.cy, wnow=JF.baseW, h=JF.baseH;
    for(var i=0;i<4;i++){
      var a = -Math.PI*0.15 + (i/3)*Math.PI*1.3 - Math.PI*0.65;
      var rr = wnow*0.42;
      var gx = cx + Math.cos(a - Math.PI/2)*rr*0.5;
      var gy = cy - h*0.42 + Math.sin(T*0.8+i)*3;
      var gr = ctx.createRadialGradient(gx, gy, 0, gx, gy, wnow*0.42);
      var col = (i%2===0)? C.peachA : C.violetC;
      gr.addColorStop(0, col+"0.42)");
      gr.addColorStop(0.6, col+"0.16)");
      gr.addColorStop(1, col+"0)");
      ctx.globalCompositeOperation="lighter";
      ctx.fillStyle=gr;
      ctx.beginPath(); ctx.arc(gx, gy, wnow*0.42, 0, 6.2832); ctx.fill();
      ctx.globalCompositeOperation="source-over";
    }
  }
  /* ---- rim point at fraction f (0..1) using current bell ---- */
  function rimPoint(f, yShift){
    var cx=JF.cx, cy=JF.cy, w=JF.baseW, h=JF.baseH;
    var ang = Math.PI*f;                 // 0 right .. pi left
    var x = cx + Math.cos(ang)*w;
    var y = cy + (yShift||0);
    return {x:x, y:y};
  }

  /* ---- one tentacle: angle-steered flowing bezier chain ---- */
  function drawTentacle(t, sc){
    var base = rimPoint(t.f, JF.baseH*0.02);
    var spread = t.side;                 // -1..1
    var ang0 = Math.PI/2 + spread*0.55 + Math.sin(T*0.7+t.phase)*0.08; // down + outward
    var len = t.len * (0.9 + 0.1*Math.sin(T*0.5+t.phase));
    var seg = t.seg;

    var px=base.x, py=base.y, ang=ang0;
    var step = len/seg;
    var prevX=px, prevY=py;

    // build smooth points
    ctx.lineCap="round"; ctx.lineJoin="round";

    // tint: blend peach <-> cyan <-> violet by hue
    var tints = [
      [C.peachA, C.peachB],
      [C.cyanA,  C.cyanB],
      [C.violetA,C.violetC]
    ];
    var ti = t.hue<0.4?0:(t.hue<0.75?1:2);
    var inner = tints[ti][0], outer = tints[ti][1];

    ctx.beginPath();
    ctx.moveTo(px, py);

    // first control for smoothness
    var lastX=px, lastY=py;
    for(var i=1;i<=seg;i++){
      var sway = Math.sin(py*0.012*t.curl + T*1.1*t.sway + t.phase)
               + 0.5*Math.sin(py*0.028 - T*0.7*t.sway + t.phase*1.3)
               + spread*0.4;
      ang += sway*0.035 + (t.oral? Math.sin(py*0.05+T*2)*0.02 : 0);
      var nx = px + Math.cos(ang)*step;
      var ny = py + Math.sin(ang)*step;
      // smooth via quadratic using midpoint
      var midX=(px+nx)/2, midY=(py+ny)/2;
      ctx.quadraticCurveTo(px, py, midX, midY);
      px=nx; py=ny;
    }
    ctx.lineTo(px, py);

    // taper + glow stroke
    var fade = 1 - (i/seg)*0.0; // path uniform; taper via alpha
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    // base glow stroke (wide, soft)
    ctx.lineWidth = t.width*1.6 * (sc.widen);
    ctx.strokeStyle = (t.oral? outer : inner) + (t.oral? "0.20":"0.16") + ")";
    ctx.shadowColor = outer + "0.7)";
    ctx.shadowBlur = t.oral? 20 : 12;
    ctx.stroke();
    // core bright stroke
    ctx.lineWidth = t.width*0.55;
    ctx.strokeStyle = (t.oral? C.white : inner) + (t.oral? "0.5":"0.42") + ")";
    ctx.shadowBlur = t.oral? 12 : 6;
    ctx.stroke();
    ctx.restore();

    // glowing nematocyst dots near the tip
    if(!t.oral && (i%2===0)){
      var ta = 0.35 + 0.35*Math.sin(T*3+t.phase);
      ctx.globalCompositeOperation="lighter";
      ctx.fillStyle = C.white + ta + ")";
      ctx.beginPath(); ctx.arc(px, py, 1.6, 0, 6.2832); ctx.fill();
      ctx.globalCompositeOperation="source-over";
    }
  }

  /* ---- rim fringe: short dancing filaments around the bell margin ---- */
  function drawFringe(skirtdrop, sc){
    var cx=JF.cx, cy=JF.cy, w=JF.baseW;
    ctx.globalCompositeOperation="lighter";
    for(var i=0;i<FRINGE.length;i++){
      var fr=FRINGE[i];
      var ang = Math.PI*fr.f;
      var bx = cx + Math.cos(ang)*w;
      var by = cy + Math.sin(T*fr.sp + fr.ph)*3;
      var len = fr.len*(1+0.3*sc.contract) + 4;
      var ex = bx + Math.sin(T*1.3+fr.ph)*5;
      var ey = by + len;
      var g = ctx.createLinearGradient(bx,by,ex,ey);
      g.addColorStop(0, C.cyanB+"0.5)");
      g.addColorStop(1, C.violetC+"0)");
      ctx.strokeStyle=g; ctx.lineWidth=1.1;
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.quadraticCurveTo(bx+Math.sin(T+fr.ph)*4, (by+ey)/2, ex, ey);
      ctx.stroke();
    }
    ctx.globalCompositeOperation="source-over";
  }

  /* ---- tap ripples ---- */
  function drawRipples(){
    for(var i=ripples.length-1;i>=0;i--){
      var r=ripples[i];
      var g=ctx.createRadialGradient(r.x, r.y, r.r*0.8, r.x, r.y, r.r);
      g.addColorStop(0, C.cyanB+"0)");
      g.addColorStop(0.85, C.cyanB+(r.a*0.5)+")");
      g.addColorStop(1, C.cyanB+"0)");
      ctx.globalCompositeOperation="lighter";
      ctx.strokeStyle=g; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.2832); ctx.stroke();
      ctx.globalCompositeOperation="source-over";
      r.r += (r.max-r.r)*0.03 + 1.4;
      r.a *= 0.965;
      if(r.a<0.01) ripples.splice(i,1);
    }
  }

  /* ================= MAIN RENDER ================= */
  function render(){
    ctx.clearRect(0,0,W,H);

    // drift the whole creature gently
    var dpx = (smooth.x-0.5), dpy=(smooth.y-0.5);
    JF.cx = W*0.5 + Math.sin(T*0.19)*W*0.03 - dpx*W*0.04;
    JF.cy = H*0.44 + Math.sin(T*0.13+1.2)*H*0.025 + Math.cos(T*0.11)*H*0.02 - dpy*H*0.04;
    JF.ang = Math.sin(T*0.07)*0.06 + dpx*0.05;

    var sc = bellScales();
    JF.squash = sc.squash;
    var w = JF.baseW*sc.widen;
    var h = JF.baseH*sc.squash;
    var skirtdrop = JF.baseH*0.26*(1 - 0.55*sc.contract);

    // depth order: far bokeh, tentacles (behind), bell, fringe, oral arms, near bokeh
    drawBokeh();

    ctx.save();
    ctx.translate(JF.cx, JF.cy);
    ctx.rotate(JF.ang);
    ctx.translate(-JF.cx, -JF.cy);

    // tentacles behind the bell
    for(var i=0;i<TENT.length;i++) drawTentacle(TENT[i], sc);

    var bell = buildBell(w, h, skirtdrop);
    drawBellBody(bell, sc);
    drawGonads(h);
    drawFringe(skirtdrop, sc);

    ctx.restore();

    drawRipples();

    // near bokeh in front (sparse, big, soft)
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    for(var k=0;k<bokeh.length;k++){
      var b=bokeh[k];
      if(b.depth<0.75) continue;
      var dx=(smooth.x-0.5)*(30+b.depth*90);
      var dy=(smooth.y-0.5)*(24+b.depth*70);
      var rr=b.r*1.7;
      var g=ctx.createRadialGradient(b.x*W+dx, b.y*H+dy, 0, b.x*W+dx, b.y*H+dy, rr);
      g.addColorStop(0, b.color+"0.05)");
      g.addColorStop(1, b.color+"0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x*W+dx, b.y*H+dy, rr, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  /* ================= LOOP ================= */
  var last=performance.now();
  function frame(now){
    var dt = Math.min(0.05, (now-last)/1000);
    last=now;
    var motion = reduce ? 0.0 : 1.0;
    T += dt * motion;
    // ease pointer
    smooth.x += (pointer.x - smooth.x) * (reduce?0.02:0.06);
    smooth.y += (pointer.y - smooth.y) * (reduce?0.02:0.06);
    // decay flash
    pulseFlash *= (reduce?1:0.93);
    if(pulseFlash<0.001) pulseFlash=0;

    render();
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);
  if(!reduce){ requestAnimationFrame(frame); }
  else { render(); } // static dream frame when motion is reduced

})();
</script>
</body>
</html>
