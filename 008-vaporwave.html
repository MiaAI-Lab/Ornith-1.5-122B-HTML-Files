<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNSET // 1987 — Vaporwave</title>
<style>
  :root{
    --pink:#ff4fd8; --magenta:#c830c0; --purple:#6a2bd6; --deep:#2a0f4d;
    --cyan:#38e8ff; --hot:#ff2e97; --sun-top:#fff2b0; --sun-mid:#ff8a5c; --sun-bot:#b32fd6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#1a0836;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }

  .world{position:fixed;inset:0;overflow:hidden}

  /* ---------- sky ---------- */
  .sky{
    position:absolute;inset:0;
    background:linear-gradient(
      to bottom,
      #160636 0%, #3a0f63 22%, #7a1f8f 40%, #d23b8e 56%, #ff6a5c 66%, #ffb04d 72%);
  }
  /* stars in the upper sky */
  .stars{position:absolute;inset:0 0 58% 0;pointer-events:none;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 20%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 28% 8%, #d9f6ff, transparent),
      radial-gradient(1.6px 1.6px at 44% 26%, #fff, transparent),
      radial-gradient(1px 1px at 62% 14%, #fff, transparent),
      radial-gradient(1.3px 1.3px at 78% 30%, #e9d6ff, transparent),
      radial-gradient(1.1px 1.1px at 88% 10%, #fff, transparent),
      radial-gradient(1px 1px at 8% 40%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 52% 4%, #fff, transparent);
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1}}

  /* ---------- chrome sun ---------- */
  .sun-wrap{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
    width:min(62vw,420px);aspect-ratio:1}
  .sun{position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(to bottom,
      var(--sun-top) 0%, #ffd76b 16%, var(--sun-mid) 42%,
      var(--hot) 64%, var(--sun-bot) 86%, #5a1e9e 100%);
    box-shadow:0 0 90px 24px rgba(255,80,180,.55), 0 0 180px 60px rgba(200,48,192,.35);
    animation:sun-pulse 5s ease-in-out infinite;
  }
  @keyframes sun-pulse{0%,100%{box-shadow:0 0 90px 24px rgba(255,80,180,.5),0 0 180px 60px rgba(200,48,192,.3)}
    50%{box-shadow:0 0 110px 34px rgba(255,80,180,.65),0 0 220px 80px rgba(200,48,192,.42)}}
  /* horizontal slits across the lower half */
  .sun::after{content:"";position:absolute;inset:0;border-radius:50%;
    background:repeating-linear-gradient(to bottom,
      transparent 0 9px, rgba(30,8,46,.92) 9px 15px);
    -webkit-mask:linear-gradient(to bottom, transparent 38%, #000 56%);
            mask:linear-gradient(to bottom, transparent 38%, #000 56%);
    animation:slit-shift 3s linear infinite;
  }
  @keyframes slit-shift{to{background-position:0 24px}}

  /* ---------- floor grid ---------- */
  .floor{position:absolute;left:50%;bottom:0;width:220vw;height:62vh;
    transform:translateX(-50%) rotateX(74deg);transform-origin:bottom center;
    background:
      repeating-linear-gradient(90deg, rgba(56,232,255,.0) 0 2px, transparent 0 0),
      linear-gradient(to bottom, rgba(200,48,192,.0) 0%, rgba(200,48,192,.35) 60%, rgba(255,47,216,.5) 100%),
      repeating-linear-gradient(90deg, var(--cyan) 0 2px, transparent 2px 70px),
      repeating-linear-gradient(0deg, var(--pink) 0 2px, transparent 2px 70px);
    animation:floor-scroll 1.1s linear infinite;
    filter:drop-shadow(0 0 6px rgba(56,232,255,.5));
  }
  @keyframes floor-scroll{from{background-position:0 0,0 0,0 0,0 0}
    to{background-position:0 0,0 0,0 0,0 70px}}

  /* sun reflection column on the water/floor */
  .reflection{position:absolute;left:50%;top:62%;transform:translateX(-50%);
    width:min(40vw,240px);height:38vh;pointer-events:none;
    background:linear-gradient(to bottom, rgba(255,120,180,.5), transparent 70%);
    -webkit-mask:repeating-linear-gradient(to bottom, #000 0 6px, transparent 6px 12px);
            mask:repeating-linear-gradient(to bottom, #000 0 6px, transparent 6px 12px);
    animation:shimmer 2.4s ease-in-out infinite;mix-blend-mode:screen}
  @keyframes shimmer{0%,100%{opacity:.55;transform:translateX(-50%) scaleY(1)}
    50%{opacity:.9;transform:translateX(-50%) scaleY(1.06)}}

  /* ---------- palm silhouettes ---------- */
  .palm{position:absolute;bottom:-2%;width:min(34vw,220px);filter:drop-shadow(0 0 2px rgba(0,0,0,.4))}
  .palm svg{display:block;width:100%;height:auto}
  .palm--l{left:-3%;transform:scaleX(1)}
  .palm--r{right:-3%;transform:scaleX(-1);width:min(28vw,180px)}
  .palm--s{left:64%;bottom:-2%;width:min(16vw,110px);opacity:.92}
  .palm path,.palm .trunk{fill:#220733}
  .palm .frond{fill:#2c0a44}
  .palm--s .frond{fill:#34104f}

  /* ---------- scanlines + CRT vignette ---------- */
  .scan{position:absolute;inset:0;pointer-events:none;z-index:6;mix-blend-mode:overlay;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
    animation:scan-drift 7s linear infinite}
  @keyframes scan-drift{to{background-position:0 6px}}
  .vignette{position:absolute;inset:0;pointer-events:none;z-index:7;
    box-shadow:inset 0 0 200px 40px rgba(10,2,26,.8)}

  /* ---------- title ---------- */
  .title{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);text-align:center;z-index:8;
    pointer-events:none}
  .title h1{font-family:"Courier New",Courier,monospace;font-weight:700;
    font-size:clamp(1.4rem,6vw,3.4rem);letter-spacing:.14em;color:#fff;
    text-shadow:0 0 8px var(--hot),3px 3px 0 var(--purple),-2px -2px 0 var(--cyan);
    animation:flicker 6s steps(1) infinite}
  .title p{font-family:"Courier New",Courier,monospace;font-size:clamp(.55rem,2.4vw,1rem);
    letter-spacing:.5em;color:var(--cyan);margin-top:8px;text-shadow:0 0 8px var(--cyan)}
  @keyframes flicker{0%,19%,21%,23%,80%,100%{opacity:1}20%,22%{opacity:.6}}

  @media(max-width:520px){ .palm--s{display:none} .title h1{text-shadow:0 0 8px var(--hot),2px 2px 0 var(--purple)} }
</style>
</head>
<body>
  <div class="world">
    <div class="sky"></div>
    <div class="stars"></div>

    <div class="sun-wrap"><div class="sun"></div></div>

    <div class="floor"></div>
    <div class="reflection"></div>

    <!-- left palm -->
    <div class="palm palm--l">
      <svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <path class="trunk" d="M96 300 C92 220 96 150 104 96 C106 90 112 90 112 96 C108 152 106 222 110 300 Z"/>
        <g class="fronds">
          <path class="frond" d="M108 92 C80 70 40 66 8 78 C40 72 78 80 106 96 Z"/>
          <path class="frond" d="M108 92 C96 58 66 36 30 30 C66 44 92 70 108 96 Z"/>
          <path class="frond" d="M108 92 C118 54 150 34 188 34 C152 48 122 72 110 96 Z"/>
          <path class="frond" d="M108 92 C140 74 178 74 198 92 C168 84 132 84 110 96 Z"/>
          <path class="frond" d="M108 92 C92 64 74 44 44 22 C74 48 96 74 108 96 Z"/>
          <path class="frond" d="M108 92 C128 66 150 50 176 44 C148 60 122 80 110 96 Z"/>
        </g>
      </svg>
    </div>

    <!-- right palm -->
    <div class="palm palm--r">
      <svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <path class="trunk" d="M96 300 C92 220 96 150 104 96 C106 90 112 90 112 96 C108 152 106 222 110 300 Z"/>
        <g class="fronds">
          <path class="frond" d="M108 92 C80 70 40 66 8 78 C40 72 78 80 106 96 Z"/>
          <path class="frond" d="M108 92 C96 58 66 36 30 30 C66 44 92 70 108 96 Z"/>
          <path class="frond" d="M108 92 C118 54 150 34 188 34 C152 48 122 72 110 96 Z"/>
          <path class="frond" d="M108 92 C140 74 178 74 198 92 C168 84 132 84 110 96 Z"/>
          <path class="frond" d="M108 92 C92 64 74 44 44 22 C74 48 96 74 108 96 Z"/>
          <path class="frond" d="M108 92 C128 66 150 50 176 44 C148 60 122 80 110 96 Z"/>
        </g>
      </svg>
    </div>

    <!-- small distant palm -->
    <div class="palm palm--s">
      <svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <path class="trunk" d="M98 300 C96 230 99 160 106 104 C107 99 112 99 112 104 C109 162 108 232 112 300 Z"/>
        <g class="fronds">
          <path class="frond" d="M109 100 C86 82 52 80 24 90 C52 86 84 88 107 102 Z"/>
          <path class="frond" d="M109 100 C100 70 74 50 46 48 C74 60 96 82 109 104 Z"/>
          <path class="frond" d="M109 100 C120 68 150 50 182 52 C152 64 124 84 111 104 Z"/>
          <path class="frond" d="M109 100 C134 86 166 88 190 100 C164 92 134 90 111 102 Z"/>
        </g>
      </svg>
    </div>

    <div class="scan"></div>
    <div class="vignette"></div>

    <div class="title">
      <h1>AFTER&nbsp;hours</h1>
      <p>▮▮ LO-FI&nbsp;RADIO&nbsp;88.3 ▮▮</p>
    </div>
  </div>
</body>
</html>
