<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fireworks — Night Display</title>
<style>
  html,body{margin:0;height:100%;background:#060812;overflow:hidden;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #sky{display:block;position:fixed;inset:0;width:100%;height:100%;cursor:crosshair;}
  .ui{
    position:fixed; z-index:2; left:0; right:0; top:5vh; text-align:center;
    pointer-events:none; user-select:none;
  }
  .ui .t{
    font-size:clamp(1.1rem,4vw,1.9rem); font-weight:300; letter-spacing:.42em;
    text-transform:uppercase; color:#f4e9cf;
    text-shadow:0 0 22px rgba(255,206,128,.35);
  }
  .ui .s{
    display:block; margin:1rem auto 0; font-size:.66rem; letter-spacing:.28em;
    text-transform:uppercase; color:rgba(244,233,207,.55);
  }
  .credit{
    position:fixed; z-index:2; right:5vw; bottom:4vh; text-align:right;
    font-size:.6rem; letter-spacing:.24em; text-transform:uppercase;
    color:rgba(244,233,207,.35); pointer-events:none;
  }
  @media (prefers-reduced-motion: reduce){
    .ui .s{ display:none; }
  }
</style>
</head>
<body>
  <div class="ui">
    <div class="t">Fireworks</div>
    <span class="s">click anywhere to launch your own</span>
  </div>
  <canvas id="sky"></canvas>
  <div class="credit">No. 083 · Night Display</div>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById("sky");
  var ctx = canvas.getContext("2d");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
  }

  // faint starfield behind the display
  var stars = [];
  function buildStars(){
    stars = [];
    var n = Math.floor((W * H) / 9000);
    for (var i = 0; i < n; i++){
      stars.push({ x: Math.random()*W, y: Math.random()*H*0.75,
        r: Math.random()*1.1 + 0.2, tw: Math.random()*Math.PI*2 });
    }
  }

  var rockets = [], particles = [];

  // curated multicolor burst palette + gold
  var HUES = [8, 28, 46, 128, 196, 222, 286, 330];

  function rand(a, b){ return a + Math.random() * (b - a); }

  function Rocket(x, targetY){
    this.x = x;
    this.y = H;
    this.sx = x;
    this.vy = -rand(11, 14);
    this.vx = rand(-1.2, 1.2);
    this.trail = [];
    this.hue = HUES[(Math.random()*HUES.length)|0];
    this.targetY = targetY != null ? targetY : rand(H*0.14, H*0.42);
    this.dead = false;
  }
  Rocket.prototype.update = function(){
    this.trail.push({ x:this.x, y:this.y });
    if (this.trail.length > 10) this.trail.shift();
    this.vy += 0.055;               // gravity slowing the ascent
    this.x += this.vx;
    this.y += this.vy;
    // burst at apex
    if (this.vy >= -0.6 || this.y <= this.targetY){
      this.dead = true;
      explode(this.x, this.y, this.hue);
    }
  };
  Rocket.prototype.draw = function(){
    ctx.lineJoin = "round";
    // spark trail
    for (var i = 1; i < this.trail.length; i++){
      var a = i / this.trail.length;
      ctx.strokeStyle = "hsla(" + this.hue + ",90%,70%," + (a*0.5) + ")";
      ctx.lineWidth = 2 * a + 0.5;
      ctx.beginPath();
      ctx.moveTo(this.trail[i-1].x, this.trail[i-1].y);
      ctx.lineTo(this.trail[i].x, this.trail[i].y);
      ctx.stroke();
    }
    // bright head
    ctx.beginPath();
    ctx.fillStyle = "hsla(" + this.hue + ",100%,88%,1)";
    ctx.shadowColor = "hsla(" + this.hue + ",100%,70%,0.9)";
    ctx.shadowBlur = 12;
    ctx.arc(this.x, this.y, 2.2, 0, 6.2832);
    ctx.fill();
    ctx.shadowBlur = 0;
  };

  function Particle(x, y, hue, speed, spark){
    var ang = Math.random() * 6.2832;
    var spd = speed * rand(0.55, 1.05);
    this.x = x; this.y = y;
    this.vx = Math.cos(ang) * spd;
    this.vy = Math.sin(ang) * spd;
    this.g = 0.042;
    this.friction = 0.982;
    this.life = 1;
    this.decay = rand(0.008, 0.02);
    this.hue = hue + rand(-7, 7);
    this.light = spark ? 86 : rand(58, 74);
    this.spark = !!spark;
    this.dead = false;
  }
  Particle.prototype.update = function(){
    this.xp = this.x; this.yp = this.y;
    this.vy += this.g;
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    if (this.life <= 0) this.dead = true;
  };
  Particle.prototype.draw = function(){
    var a = Math.max(this.life, 0);
    if (this.spark){
      // short crackle: quick white-hot flicker
      ctx.strokeStyle = "hsla(48,100%," + this.light + "%," + a + ")";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(this.xp, this.yp);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
      return;
    }
    ctx.strokeStyle = "hsla(" + this.hue + ",92%," + this.light + "%," + a + ")";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(this.xp, this.y);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
  };

  function explode(x, y, hue){
    var count = 68 + ((Math.random()*40)|0);
    var gold = hue === 46 || Math.random() < 0.14;
    var bh = gold ? 44 : hue;
    for (var i = 0; i < count; i++){
      particles.push(new Particle(x, y, bh, rand(2.4, 6.6), false));
    }
    // crackle sparkle ring
    var crack = 14 + ((Math.random()*16)|0);
    for (var j = 0; j < crack; j++){
      particles.push(new Particle(x, y, 46, rand(3.5, 8.5), true));
    }
    // central flash
    flashes.push({ x:x, y:y, r:4, life:1, hue:bh });
  }
  var flashes = [];

  function launch(x, targetY){
    var rx = x != null ? x : rand(W*0.14, W*0.86);
    rockets.push(new Rocket(rx, targetY));
  }

  // auto display
  var autoTimer = null;
  function scheduleAuto(){
    if (reduce) return;
    var delay = rand(650, 1500);
    autoTimer = setTimeout(function(){
      launch();
      scheduleAuto();
    }, delay);
  }

  canvas.addEventListener("pointerdown", function(e){
    launch(e.clientX, e.clientY * 0.6 + rand(-30, 30));
    if (reduce) scheduleAuto();
  });

  window.addEventListener("resize", resize);

  function drawStars(t){
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      var tw = 0.4 + 0.6 * (0.5 + 0.5*Math.sin(t*0.002 + s.tw));
      ctx.fillStyle = "rgba(220,228,255," + (0.25*tw).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }
  }

  var last = 0;
  function frame(t){
    // trailing fade for glowing streaks
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(6,8,18,0.22)";
    ctx.fillRect(0, 0, W, H);

    drawStars(t);

    ctx.globalCompositeOperation = "lighter";

    // rockets
    for (var i = rockets.length - 1; i >= 0; i--){
      rockets[i].update();
      rockets[i].draw();
      if (rockets[i].dead) rockets.splice(i, 1);
    }
    // particles
    for (var j = particles.length - 1; j >= 0; j--){
      particles[j].update();
      particles[j].draw();
      if (particles[j].dead) particles.splice(j, 1);
    }
    // central flashes
    for (var k = flashes.length - 1; k >= 0; k--){
      var f = flashes[k];
      var grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      grad.addColorStop(0, "hsla(" + f.hue + ",100%,92%," + f.life + ")");
      grad.addColorStop(1, "hsla(" + f.hue + ",100%,70%,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, 6.2832);
      ctx.fill();
      f.r += 5;
      f.life -= 0.06;
      if (f.life <= 0) flashes.splice(k, 1);
    }

    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }

  // init
  resize();
  ctx.fillStyle = "#060812";
  ctx.fillRect(0, 0, W, H);
  if (reduce){
    // one quiet volley, then hold
    launch(W*0.5, H*0.3);
  } else {
    launch(W*0.32, H*0.34);
    launch(W*0.68, H*0.28);
    scheduleAuto();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
