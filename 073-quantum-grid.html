<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum · Probability Field</title>
<style>
  :root{
    --bg-0:#03030a;
    --bg-1:#070712;
    --blue:#3d7bff;
    --cyan:#22e2ff;
    --magenta:#ff2ea6;
    --violet:#b14dff;
    --ink:#cfd8ff;
    --ink-dim:rgba(180,196,255,.55);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:Menlo,Consolas,"Courier New",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(125% 110% at 50% 8%, #10143a 0%, #0a0d22 40%, #05060f 72%, #03030a 100%);
    font-family:var(--sans);
    color:var(--ink);
    cursor:crosshair;
    -webkit-font-smoothing:antialiased;
  }
  canvas#grid{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* deep-space star dust */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(180,210,255,.5), transparent),
      radial-gradient(1px 1px at 70% 18%, rgba(255,200,240,.45), transparent),
      radial-gradient(1.5px 1.5px at 42% 62%, rgba(160,200,255,.35), transparent),
      radial-gradient(1px 1px at 86% 74%, rgba(200,190,255,.4), transparent),
      radial-gradient(1px 1px at 12% 82%, rgba(150,220,255,.35), transparent);
    opacity:.7;mix-blend-mode:screen;
  }
  /* vignette + faint scan haze */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
    box-shadow:inset 0 0 220px 60px rgba(0,0,0,.72);
    background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(60,90,200,.05) 100%);
  }

  .frame{position:fixed;inset:0;z-index:5;pointer-events:none}

  .wordmark{
    position:absolute;top:clamp(20px,4vw,54px);left:clamp(20px,4vw,56px);
  }
  .wordmark .kicker{
    font-family:var(--mono);font-size:11px;letter-spacing:.42em;
    text-transform:uppercase;color:var(--cyan);opacity:.85;
    display:flex;align-items:center;gap:12px;
  }
  .wordmark .kicker::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,var(--cyan),transparent)}
  .wordmark h1{
    font-size:clamp(30px,6.4vw,84px);font-weight:650;line-height:.92;
    letter-spacing:-.02em;margin-top:12px;
    background:linear-gradient(100deg,#eaf1ff 0%, #7fb0ff 34%, #c98bff 66%, #ff7fce 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 30px rgba(120,150,255,.28));
  }
  .wordmark .sub{
    margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;
    color:var(--ink-dim);max-width:420px;text-transform:uppercase;line-height:1.9;
  }

  .panel{
    position:absolute;right:clamp(20px,4vw,56px);top:clamp(20px,4vw,54px);
    text-align:right;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    color:var(--ink-dim);text-transform:uppercase;line-height:2;
  }
  .panel .readout{color:var(--cyan);opacity:.9}
  .panel .row{display:flex;gap:14px;justify-content:flex-end;align-items:baseline}
  .panel .val{font-variant-numeric:tabular-nums;color:#eaf1ff;opacity:.95}

  .legend{
    position:absolute;left:clamp(20px,4vw,56px);bottom:clamp(22px,4vw,52px);
    display:flex;align-items:center;gap:16px;font-family:var(--mono);
    font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-dim);
  }
  .legend .bar{
    width:clamp(120px,20vw,260px);height:8px;border-radius:20px;
    background:linear-gradient(90deg,var(--blue),var(--violet),var(--magenta));
    box-shadow:0 0 18px rgba(120,80,255,.4);
  }
  .legend .tick{opacity:.7}

  .hint{
    position:absolute;right:clamp(20px,4vw,56px);bottom:clamp(22px,4vw,52px);
    text-align:right;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;
    color:var(--ink-dim);text-transform:uppercase;line-height:1.9;
  }
  .hint b{color:var(--magenta);font-weight:400}

  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 10px var(--cyan);
    animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

  @media (prefers-reduced-motion:reduce){ .dot{animation:none} }
  @media(max-width:640px){
    .panel,.hint{display:none}
    .wordmark .sub{font-size:10px}
  }
</style>
</head>
<body>
  <canvas id="grid"></canvas>

  <div class="frame">
    <div class="wordmark">
      <div class="kicker">Wavefunction&nbsp;·&nbsp;Lattice&nbsp;Σ</div>
      <h1>Quantum<br>Probability</h1>
      <div class="sub">A warped probability lattice — amplitude ripples propagate through the node field in electric blue and magenta.</div>
    </div>

    <div class="panel">
      <div class="row"><span>STATE</span><span class="dot"></span></div>
      <div class="row"><span>ENTANGLED NODES</span><span class="val readout" id="nodeCount">—</span></div>
      <div class="row"><span>AMPLITUDE</span><span class="val readout" id="ampRead">—</span></div>
      <div class="row"><span>WAVEPACKET</span><span class="val readout" id="wpPhase">—</span></div>
    </div>

    <div class="legend">
      <span class="tick">|ψ| low</span>
      <span class="bar"></span>
      <span class="tick">high</span>
    </div>

    <div class="hint">
      Move cursor — warp the viewpoint<br>
      <b>Click</b> — collapse a probability burst
    </div>
  </div>
  <script>
  (function(){
    "use strict";

    var canvas = document.getElementById('grid');
    var ctx = canvas.getContext('2d', { alpha:false });
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    var W, H, CX, CY, FOCAL;

    // ---- lattice config ----
    var COLS = 40, ROWS = 22;      // node counts
    var SPACING = 52;              // world spacing between nodes
    var HALF_X = (COLS - 1) * SPACING * 0.5;
    var HALF_Z = (ROWS - 1) * SPACING * 0.5;
    var CAM = 900;                 // camera distance along +z

    // ---- state ----
    var nodes = [];                // {bx, bz, y, sx, sy, s, amp}
    var particles = [];            // drifting glow motes
    var ripples = [];              // click-triggered probability bursts
    var mouse = { x:0.5, y:0.5, tx:0.5, ty:0.5 };
    var t = 0;
    var reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

    var elNode = document.getElementById('nodeCount');
    var elAmp  = document.getElementById('ampRead');
    var elWp   = document.getElementById('wpPhase');

    function resize(){
      W = window.innerWidth; H = window.innerHeight;
      CX = W * 0.5; CY = H * 0.52;
      FOCAL = Math.min(W, H) * 0.95;
      canvas.width  = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width  = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    /* ---------- build lattice ---------- */
    function buildGrid(){
      nodes = [];
      for(var r = 0; r < ROWS; r++){
        for(var c = 0; c < COLS; c++){
          nodes.push({
            bx: c * SPACING - HALF_X,
            bz: r * SPACING - HALF_Z,
            y: 0, sx: 0, sy: 0, s: 1, amp: 0
          });
        }
      }
      elNode.textContent = (COLS * ROWS).toLocaleString();
    }

    /* ---------- build drifting motes ---------- */
    function buildMotes(){
      var n = Math.round((W * H) / 26000);
      particles = [];
      for(var i = 0; i < n; i++){
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          z: Math.random(),
          r: Math.random() * 1.6 + 0.4,
          tw: Math.random() * Math.PI * 2,
          hue: 205 + Math.random() * 115,
          vy: -(Math.random() * 8 + 3),
          vx: (Math.random() - 0.5) * 6
        });
      }
    }

    /* ---------- amplitude field (probability wave) ---------- */
    function amplitude(c, r){
      var cx = COLS * 0.5, cz = ROWS * 0.5;
      var dx = c - cx, dz = r - cz;
      var d = Math.sqrt(dx * dx + dz * dz);
      var a = 0;
      // planar travelling waves (interference)
      a += 0.55 * Math.sin(c * 0.30 - t * 1.3);
      a += 0.45 * Math.sin(r * 0.34 - t * 1.0 + 1.3);
      a += 0.35 * Math.sin(c * 0.14 + r * 0.14 + t * 0.6);
      // concentric ripple (probability outburst)
      a += 0.6 * Math.sin(d * 0.55 - t * 2.2) * Math.exp(-d * 0.03);
      // one bright wavepacket sweeping diagonally across the lattice
      var wp = Math.sqrt(Math.pow(c - ((t * 5.5) % COLS), 2) +
                         Math.pow(r - ((t * 4.0) % ROWS), 2));
      a += 1.15 * Math.exp(-wp * wp / 46) * Math.sin(wp * 1.4 - t * 4.5);
      // click-triggered bursts
      for(var i = 0; i < ripples.length; i++){
        var rp = ripples[i];
        var rd = Math.abs(d - rp.ring);
        a += rp.amp * Math.exp(-rd * rd / 28) * Math.sin(rp.ring * 0.9);
      }
      return a;
    }

    /* ---------- projection ---------- */
    function project(p, pitch, yaw){
      var x = p.bx, z = p.bz, y = p.y;
      var cp = Math.cos(pitch), sp = Math.sin(pitch);
      // rotate around X (tilt the plane toward viewer)
      var y1 = y * cp - z * sp;
      var z1 = y * sp + z * cp;
      var cy = Math.cos(yaw), sy = Math.sin(yaw);
      // rotate around Y (mouse steer)
      var x2 = x * cy + z1 * sy;
      var z2 = -x * sy + z1 * cy;
      var perspective = FOCAL / (FOCAL + z2 + CAM);
      p.sx = CX + x2 * perspective;
      p.sy = CY + y1 * perspective;
      p.s  = perspective;
    }

    /* ---------- color from amplitude ---------- */
    // hue 210 (electric blue) -> 300 (violet) -> 322 (magenta)
    function hueFor(amp){
      var n = amp * 0.5 + 0.5;               // 0..1
      return 208 + n * 116;
    }

    function draw(){
      // fade trail for a luminous persistence
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(3,3,10,' + (reduced ? 1 : 0.28) + ')';
      ctx.fillRect(0, 0, W, H);

      var pitch = 1.02 + (mouse.ty - 0.5) * 0.5;   // base tilt ~58deg
      var yaw   = (mouse.tx - 0.5) * 0.55;

      // update amplitude + project
      var i, n = nodes.length, c, r, p, prev;
      var maxA = 0;
      for(i = 0; i < n; i++){
        p = nodes[i];
        c = i % COLS; r = (i / COLS) | 0;
        p.amp = amplitude(c, r);
        p.y = p.amp * 30;                 // world height of the wave surface
        project(p, pitch, yaw);
        if(Math.abs(p.amp) > maxA) maxA = Math.abs(p.amp);
      }

      // ---- lattice lines (additive glow) ----
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth = 1;
      for(r = 0; r < ROWS; r++){
        for(c = 0; c < COLS; c++){
          p = nodes[r * COLS + c];
          // horizontal neighbour
          if(c < COLS - 1){
            prev = nodes[r * COLS + c + 1];
            drawGlow(p, prev, (p.amp + prev.amp) * 0.5, 0.5 * p.s);
          }
          // vertical neighbour
          if(r < ROWS - 1){
            prev = nodes[(r + 1) * COLS + c];
            drawGlow(p, prev, (p.amp + prev.amp) * 0.5, 0.5 * p.s);
          }
        }
      }

      // ---- nodes (bright intersections) ----
      for(i = 0; i < n; i++){
        p = nodes[i];
        var hue = hueFor(p.amp);
        var lum = 46 + (p.amp * 0.5 + 0.5) * 24;
        var alpha = 0.10 + (p.amp * 0.5 + 0.5) * 0.34;
        var rad = (1.1 + (p.amp * 0.5 + 0.5) * 2.4) * Math.min(p.s * 1.4, 1.6);
        if(rad < 0.4) rad = 0.4;
        var g = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, rad * 4);
        g.addColorStop(0, 'hsla(' + hue + ',95%,' + lum + '%, ' + alpha + ')');
        g.addColorStop(0.35, 'hsla(' + hue + ',95%,' + (lum - 8) + '%, ' + (alpha * 0.5) + ')');
        g.addColorStop(1, 'hsla(' + hue + ',95%,' + lum + '%,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.sx, p.sy, rad * 4, 0, 6.2832);
        ctx.fill();
      }

      // ---- drifting motes ----
      for(i = 0; i < particles.length; i++){
        var m = particles[i];
        if(!reduced){
          m.y += m.vy * 0.35; m.x += m.vx * 0.35; m.tw += 0.05;
          if(m.y < -10){ m.y = H + 10; m.x = Math.random() * W; }
          if(m.x < -10) m.x = W + 10; if(m.x > W + 10) m.x = -10;
        }
        var flick = 0.35 + Math.abs(Math.sin(m.tw)) * 0.65;
        ctx.fillStyle = 'hsla(' + m.hue + ',90%,78%,' + (flick * 0.5) + ')';
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r * m.s, 0, 6.2832);
        ctx.fill();
      }

      ctx.globalCompositeOperation = 'source-over';

      // HUD readouts (throttled visually)
      elAmp.textContent  = (maxA.toFixed(2));
      elWp.textContent   = (((t * 5.5) % COLS).toFixed(1)) + '·' + (((t * 4) % ROWS).toFixed(1));
    }

    function drawGlow(a, b, amp, alphaBase){
      var hue = hueFor(amp);
      var a2 = Math.max(0.02, alphaBase * (0.35 + Math.abs(amp) * 0.5));
      ctx.strokeStyle = 'hsla(' + hue + ',95%,64%,' + a2 + ')';
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy);
      ctx.lineTo(b.sx, b.sy);
      ctx.stroke();
    }

    /* ---------- loop ---------- */
    var last = performance.now();
    function frame(now){
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if(!reduced){
        t += dt * 0.9;
        mouse.tx += (mouse.x - mouse.tx) * 0.05;
        mouse.ty += (mouse.y - mouse.ty) * 0.05;
        for(var i = ripples.length - 1; i >= 0; i--){
          ripples[i].ring += dt * 26;
          ripples[i].amp *= 0.965;
          if(ripples[i].amp < 0.02) ripples.splice(i, 1);
        }
      }
      draw();
      requestAnimationFrame(frame);
    }

    /* ---------- interaction ---------- */
    window.addEventListener('mousemove', function(e){
      mouse.x = e.clientX / W;
      mouse.y = e.clientY / H;
    });
    window.addEventListener('touchmove', function(e){
      if(e.touches[0]){ mouse.x = e.touches[0].clientX / W; mouse.y = e.touches[0].clientY / H; }
    }, { passive:true });

    function collapse(x, y){
      // fire a probability burst from the nearest lattice region
      ripples.push({ ring: 0, amp: 1.4 });
      // burst of motes from the click point
      for(var i = 0; i < 18; i++){
        var ang = Math.random() * 6.2832;
        var spd = Math.random() * 60 + 20;
        particles.push({
          x:x, y:y, z:1, r:Math.random()*1.8+0.6, tw:Math.random()*6.28,
          hue:205+Math.random()*115, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, burst:true
        });
      }
      if(particles.length > 900) particles.splice(0, particles.length - 900);
    }
    window.addEventListener('click', function(e){ collapse(e.clientX, e.clientY); });
    window.addEventListener('touchstart', function(e){
      if(e.touches[0]) collapse(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive:true });

    var rTimer;
    window.addEventListener('resize', function(){
      clearTimeout(rTimer);
      rTimer = setTimeout(function(){ resize(); buildMotes(); }, 150);
    });

    /* ---------- boot ---------- */
    resize();
    buildGrid();
    buildMotes();
    frame(performance.now());
  })();
  </script>
</body>
</html>
