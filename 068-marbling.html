<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marbling — Ebru Fluid Reveal</title>
<style>
  :root{
    --cream:#efe2c4;
    --cream2:#e6d5ac;
    --ink:#2a1e12;
    --crimson:#c0272d;
    --gold:#e0a725;
    --teal:#1f8a83;
    --cobalt:#274690;
    --serif:Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);color:#f3ecdb;overflow:hidden}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased}

  .marble-wrap{position:fixed;inset:0;z-index:0}
  canvas#marble{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* the paper "lift sheet" that covers the pattern, then lifts away */
  .sheet{position:fixed;inset:0;z-index:2;pointer-events:none;
    transform-origin:bottom center;
    transition:transform 1.5s cubic-bezier(.7,0,.2,1), opacity 1.5s ease;
    background:
      radial-gradient(140% 120% at 50% 40%, rgba(255,251,238,.96), rgba(238,224,190,.96) 60%, #d8c495 100%);
    box-shadow:0 -30px 90px rgba(0,0,0,.35);}
  .sheet::before{content:"";position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;
    /* paper fibre speckle, drawn as layered radial noise via gradients */
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(120,90,50,.14), transparent 60%),
      radial-gradient(2px 2px at 70% 60%, rgba(120,90,50,.12), transparent 60%),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(120,90,50,.12), transparent 60%),
      radial-gradient(1.5px 1.5px at 85% 20%, rgba(120,90,50,.1), transparent 60%),
      radial-gradient(2px 2px at 55% 45%, rgba(120,90,50,.1), transparent 60%),
      radial-gradient(1px 1px at 12% 65%, rgba(120,90,50,.12), transparent 60%),
      radial-gradient(1px 1px at 92% 78%, rgba(120,90,50,.12), transparent 60%);}
  .sheet::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.14), transparent 18%, transparent 82%, rgba(0,0,0,.2));}
  .sheet.lift{transform:translateY(-104%) rotate(-1.2deg);opacity:0;pointer-events:none}
  .sheet .fold{position:absolute;left:0;right:0;bottom:0;height:34px;
    background:linear-gradient(180deg, transparent, rgba(120,90,45,.35));}

  .vignette{position:fixed;inset:0;z-index:3;pointer-events:none;
    box-shadow:inset 0 0 24vw rgba(20,12,4,.55)}

  .hud{position:fixed;inset:0;z-index:4;pointer-events:none;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:clamp(20px,4vw,50px) clamp(22px,5vw,64px)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    font-family:var(--mono);font-size:.64rem;letter-spacing:.3em;text-transform:uppercase;color:#c9bfa5}
  .top .st{color:var(--gold)}
  .title{font-family:var(--serif);font-weight:400;line-height:.86;letter-spacing:-.01em;
    font-size:clamp(2.6rem,9vw,8rem);
    background:linear-gradient(115deg,var(--crimson) 0%, var(--gold) 42%, var(--teal) 78%, var(--cobalt) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{margin-top:16px;max-width:40ch;font-size:clamp(.8rem,1.4vw,1rem);line-height:1.62;color:#e9e0cd}
  .row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .hint{font-family:var(--mono);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:#b9ad90}
  .cta{pointer-events:auto;font-family:var(--mono);font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;
    color:#2a1e12;border:1px solid rgba(42,30,18,.4);border-radius:999px;padding:.7em 1.3em;
    background:linear-gradient(180deg,#fbf4df,#efe2c4);cursor:pointer;transition:.35s;
    box-shadow:0 6px 22px rgba(0,0,0,.35)}
  .cta:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(192,39,45,.4)}
  .cta.sub{background:linear-gradient(180deg,#3a2c18,#2a1e12);color:#f3ecdb;border-color:rgba(233,185,73,.4)}
  @media (max-width:640px){.top{flex-direction:column;gap:8px}}
</style>
</head>
<body>
<div class="marble-wrap" aria-hidden="true">
  <canvas id="marble"></canvas>
</div>
<div class="sheet" id="sheet"><span class="fold"></span></div>
<div class="vignette" aria-hidden="true"></div>

<div class="hud">
  <div class="top">
    <span>Studio · <b>Ebru — fluid pigment on size</b></span>
    <span class="st" id="state">sheet down · latent pattern</span>
  </div>

  <div>
    <h1 class="title">Ebru</h1>
    <p class="lede">Liquid pigment floats on a viscous bath, combed into concentric veins.
      Lay a sheet of paper, lift it, and the marbled skin is caught forever in one gesture.</p>
  </div>

  <div class="row">
    <span class="hint" id="hint">the pattern forms beneath the sheet</span>
    <button class="cta" id="lift">Lift the sheet</button>
    <button class="cta sub" id="renew">Re-submerge</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cv=document.getElementById("marble");
  if(!cv || !cv.getContext) return;
  var ctx=cv.getContext("2d");
  var sheet=document.getElementById("sheet");
  var stateEl=document.getElementById("state");
  var hintEl=document.getElementById("hint");
  var liftEl=document.getElementById("lift");
  var renewEl=document.getElementById("renew");

  var DPR=Math.min(window.devicePixelRatio||1,2);
  var W=0,H=0;
  var palette=[
    [192,39,45],[216,54,60],   // crimson
    [224,167,37],[236,190,78], // gold
    [31,138,131],[46,176,162], // teal
    [39,70,144],[54,94,190]    // cobalt
  ];
  var veins=[], blobs=[], combs=[];
  var grow=0;                 // 0..1 bloom factor after reveal
  var revealed=false;

  var rnd=(function(s){return function(){s=(s*1664525+1013904223)&0x7fffffff;return s/0x7fffffff;};})(987654321);
  function pick(a){return a[Math.floor(rnd()*a.length)];}

  function build(){
    veins=[]; blobs=[]; combs=[];
    var n=Math.round(15+rnd()*6);
    for(var i=0;i<n;i++){
      veins.push({
        y0:rnd(), amp:20+rnd()*120, freq:0.0015+rnd()*0.006,
        phase:rnd()*6.28, w:14+rnd()*64, col:pick(palette),
        a:0.12+rnd()*0.30, drift:0.2+rnd()*0.9, off:rnd()*1000
      });
    }
    for(var j=0;j<6;j++){
      blobs.push({
        x:rnd(), y:rnd(), r:0.18+rnd()*0.4, col:pick(palette),
        a:0.05+rnd()*0.13, px:rnd()*6.28, py:rnd()*6.28, sx:0.08+rnd()*0.16, sy:0.08+rnd()*0.16
      });
    }
    var m=Math.round(34+rnd()*16);
    for(var k=0;k<m;k++){
      combs.push({
        y0:rnd(), amp:8+rnd()*40, freq:0.003+rnd()*0.008, phase:rnd()*6.28,
        w:1+rnd()*2.4, col:pick(palette), a:0.06+rnd()*0.14, drift:0.3+rnd()*0.8
      });
    }
  }
  build();

  function resize(){
    W=window.innerWidth; H=window.innerHeight;
    cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
    cv.style.width=W+"px"; cv.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  function rgba(c,a){return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";}

  function draw(t){
    // cream bath
    ctx.globalCompositeOperation="source-over";
    var g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,"#f3e8cc"); g.addColorStop(0.55,"#efe2c2"); g.addColorStop(1,"#e6d4a6");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    // pigment washes (blobs) that slowly drift & morph
    ctx.globalCompositeOperation="source-over";
    for(var b=0;b<blobs.length;b++){
      var bl=blobs[b];
      var bx=(bl.x+0.12*Math.sin(t*0.00008*bl.sx+bl.px))*W;
      var by=(bl.y+0.12*Math.sin(t*0.00008*bl.sy+bl.py))*H;
      var br=bl.r*Math.min(W,H)*(0.85+0.3*Math.sin(t*0.00012+bl.px));
      var rg=ctx.createRadialGradient(bx,by,0,bx,by,br);
      rg.addColorStop(0,rgba(bl.col,bl.a*grow));
      rg.addColorStop(1,rgba(bl.col,0));
      ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    }

    // combed veins — multiply for true pigment overlap
    ctx.globalCompositeOperation="multiply";
    ctx.lineCap="round";
    var step=Math.max(10,W/220);
    for(var v=0;v<veins.length;v++){
      var vn=veins[v];
      var baseY=vn.y0*H;
      ctx.strokeStyle=rgba(vn.col,vn.a*grow);
      ctx.lineWidth=vn.w*(0.5+0.5*grow);
      ctx.beginPath();
      for(var x=-step;x<=W+step;x+=step){
        var y=baseY+vn.amp*grow*Math.sin(x*vn.freq+vn.phase+t*0.0006*vn.drift);
        if(x<=0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }

    // fine comb texture (thin parallel wavy lines)
    ctx.lineWidth=1;
    for(var c=0;c<combs.length;c++){
      var cm=combs[c]; var baseY=cm.y0*H;
      ctx.strokeStyle=rgba(cm.col,cm.a*grow);
      ctx.beginPath();
      for(var x2=-step;x2<=W+step;x2+=step){
        var y2=baseY+cm.amp*grow*Math.sin(x2*cm.freq+cm.phase+t*0.0005*cm.drift);
        if(x2<=0) ctx.moveTo(x2,y2); else ctx.lineTo(x2,y2);
      }
      ctx.stroke();
    }
    ctx.globalCompositeOperation="source-over";

    // soft skin / size sheen
    var sheen=ctx.createRadialGradient(W*0.3,H*0.25,0,W*0.3,H*0.25,Math.max(W,H)*0.8);
    sheen.addColorStop(0,"rgba(255,252,240,0.10)");
    sheen.addColorStop(1,"rgba(255,252,240,0)");
    ctx.fillStyle=sheen; ctx.fillRect(0,0,W,H);
  }

  resize();
  window.addEventListener("resize",resize);

  function loop(t){ draw(t); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  // ---------- interaction ----------
  function lift(){
    if(!revealed){
      revealed=true; grow=0;
      // animate grow-in (bloom into marbled pattern)
      var start=performance.now();
      (function bloom(now){
        var p=Math.min(1,(now-start)/1400);
        grow=p*(0.85+0.15*p);
        if(p<1) requestAnimationFrame(bloom); else grow=1;
      })(performance.now());
    }
    sheet.classList.add("lift");
    if(stateEl) stateEl.textContent="sheet lifted · pattern caught";
    if(hintEl) hintEl.textContent="pigment locked into the sheet";
  }
  function renew(){
    sheet.classList.remove("lift");
    revealed=false; grow=0;
    build();
    if(stateEl) stateEl.textContent="sheet down · latent pattern";
    if(hintEl) hintEl.textContent="the pattern forms beneath the sheet";
    // re-lift after the sheet settles
    setTimeout(lift, 900);
  }
  if(liftEl) liftEl.addEventListener("click",lift);
  if(renewEl) renewEl.addEventListener("click",renew);
  if(sheet) sheet.addEventListener("click",function(){ if(!sheet.classList.contains("lift")) lift(); });

  // lift automatically once the bath has formed a little
  setTimeout(function(){ if(!revealed){ grow=0.5; } }, reduce?0:2200);
})();
</script>
</body>
</html>
