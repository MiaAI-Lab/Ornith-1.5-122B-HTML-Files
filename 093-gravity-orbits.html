<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kepler's Playground · N-Body Gravity</title>
<style>
  :root{
    --bg-0:#04060f; --bg-1:#080b18; --bg-2:#0c1226;
    --ink:#eaf0ff; --muted:#93a3cc;
    --glass:rgba(255,255,255,.05);
    --line:rgba(150,180,255,.18);
    --accent:#7cc4ff;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 120% at 50% 18%, #10193a 0%, #0a0f24 40%, #060917 72%, #03040d 100%);
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  #stage{position:fixed;inset:0;z-index:0;display:block;cursor:crosshair}

  /* faint background starfield, static, painted onto a separate canvas once */
  #sky{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}

  header{position:fixed;top:0;left:0;right:0;z-index:5;
    padding:clamp(16px,3vw,28px) clamp(18px,4vw,40px) 0;
    pointer-events:none;display:flex;flex-direction:column;gap:6px}
  .eyebrow{font-family:Georgia,"Times New Roman",serif;letter-spacing:.42em;text-transform:uppercase;
    font-size:clamp(.58rem,1.3vw,.74rem);color:var(--accent);opacity:.85;margin:0}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.03em;
    font-size:clamp(1.5rem,4.6vw,2.9rem);margin:0;
    background:linear-gradient(180deg,#ffffff,#a9c6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:clamp(.74rem,1.7vw,.92rem);letter-spacing:.05em;margin:0;max-width:52ch}
  .sub b{color:#cfe0ff;font-weight:600}

  /* ---------- CONTROL BAR ---------- */
  .bar{position:fixed;left:50%;bottom:clamp(14px,3vh,26px);transform:translateX(-50%);z-index:6;
    display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:linear-gradient(180deg, rgba(20,28,56,.72), rgba(10,15,34,.72));
    border:1px solid var(--line);border-radius:999px;padding:9px 16px;
    box-shadow:0 14px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(12px);max-width:calc(100vw - 24px)}
  .grp{display:flex;align-items:center;gap:8px}
  .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
  .lbl{color:var(--muted);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
  button.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);
    border-radius:999px;padding:7px 15px;font:inherit;font-size:.74rem;letter-spacing:.08em;cursor:pointer;
    transition:background .18s,border-color .18s,color .18s,transform .1s}
  button.ghost:hover{background:rgba(120,160,255,.18);border-color:rgba(150,180,255,.55);color:#fff}
  button.ghost:active{transform:scale(.96)}
  button.ghost.primary{background:linear-gradient(180deg,rgba(124,196,255,.22),rgba(124,196,255,.1));
    border-color:rgba(140,190,255,.5)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,#3a5fc0,#7cc4ff);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#fff;box-shadow:0 0 0 3px rgba(120,160,255,.4),0 2px 6px rgba(0,0,0,.45);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;
    background:#fff;box-shadow:0 0 0 3px rgba(120,160,255,.4)}
  .val{min-width:34px;text-align:center;color:#bcd0ff;font-variant-numeric:tabular-nums;font-size:.76rem}
  .toggle{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
  .toggle input{accent-color:#6f97ff;margin:0}

  /* launch readout near the pointer */
  #hint{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-160%);
    padding:6px 11px;border-radius:999px;font-size:.7rem;letter-spacing:.05em;
    background:rgba(12,18,40,.8);border:1px solid rgba(150,180,255,.28);color:#cfe0ff;
    box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .15s;white-space:nowrap}
  #hint.show{opacity:1}
  #hint .k{color:var(--accent)}

  footer{position:fixed;right:clamp(16px,4vw,40px);bottom:clamp(70px,12vh,96px);z-index:5;
    color:var(--muted);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;opacity:.5;
    pointer-events:none}

  @media (max-width:560px){
    .bar{gap:9px;padding:8px 11px}
    .lbl{font-size:.6rem}
    input[type=range]{width:80px}
    .sep{display:none}
  }
  @media (prefers-reduced-motion: reduce){}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="stage"></canvas>

<header>
  <p class="eyebrow">A Sandbox of Falling Bodies</p>
  <h1>Kepler&rsquo;s Playground</h1>
  <p class="sub">Press and drag on the void to <b>slingshot</b> a new world into being &mdash; release to fling it.
  Watch orbits settle, threads of light trace each body, and worlds that collide <b>merge</b> into one.</p>
</header>

<div id="hint" role="status" aria-live="polite"></div>

<div class="bar" id="panel">
  <button class="ghost primary" id="playBtn" aria-label="Pause or play">❚❚ Pause</button>
  <div class="sep"></div>
  <label class="ctrl lbl">Gravity
    <input type="range" id="gConst" min="20" max="400" step="5" value="160">
    <span class="val" id="gVal">160</span>
  </label>
  <div class="sep"></div>
  <label class="ctrl lbl">Mass
    <input type="range" id="massS" min="6" max="60" step="1" value="20">
    <span class="val" id="massVal">20</span>
  </label>
  <div class="sep"></div>
  <label class="toggle lbl"><input type="checkbox" id="trails" checked> Trails</label>
  <div class="sep"></div>
  <button class="ghost" id="seedBtn">Seed system</button>
  <button class="ghost" id="clearBtn">Clear</button>
</div>

<footer>Orinth · Light Lab — 093</footer>

<script>
"use strict";
(function(){

/* ============================================================
   SKY — a one-time static starfield behind everything
   ============================================================ */
var sky=document.getElementById('sky'), skyX=sky.getContext('2d');
function paintSky(){
  skyX.clearRect(0,0,sky.width,sky.height);
  var n=Math.min(240, Math.max(60, Math.floor(innerWidth*innerHeight/9000)));
  for(var i=0;i<n;i++){
    var r=Math.random()*1.3+0.2, a=Math.random()*0.6+0.25;
    skyX.globalAlpha=a;
    skyX.fillStyle= Math.random()<0.2 ? '#bcd6ff' : '#ffffff';
    skyX.beginPath();
    skyX.arc(Math.random()*sky.width, Math.random()*sky.height, r, 0, 6.2832);
    skyX.fill();
  }
  skyX.globalAlpha=1;
}
function resizeSky(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  sky.width=innerWidth*dpr; sky.height=innerHeight*dpr;
  sky.style.width=innerWidth+'px'; sky.style.height=innerHeight+'px';
  skyX.setTransform(dpr,0,0,dpr,0,0);
  paintSky();
}

/* ============================================================
   STAGE — the simulation canvas
   ============================================================ */
var c=document.getElementById('stage'), x=c.getContext('2d');
var w=0,h=0,dpr=1, cx=0,cy=0;
var G=160, soft=6;                 // gravitational constant, softening
var TRAIL_MAX=70;

var PALETTE=[
  ['#8fd0ff','#2b6fff'], ['#ff8ad0','#c02bff'], ['#ffd36b','#ff8a2e'],
  ['#8affc1','#12b878'], ['#c79bff','#7a3cff'], ['#9ff0ff','#1fb8c8'],
  ['#ff9e7a','#ff4d6d']
];
function pickColor(){ return PALETTE[(Math.random()*PALETTE.length)|0]; }

var bodies=[];

function makeBody(x,y,vx,vy,mass,color){
  var r=Math.cbrt(mass)*1.9 + 3;
  return {x:x,y:y,vx:vx,vy:vy,mass:mass,r:r,color:color||pickColor(),
          trail:[], life:1, born:0};
}

/* ---------- physics ---------- */
function step(dt){
  var n=bodies.length;
  var ax=new Array(n), ay=new Array(n);
  for(var i=0;i<n;i++){ ax[i]=0; ay[i]=0; }
  for(var i=0;i<n;i++){
    for(var j=i+1;j<n;j++){
      var a=bodies[i], b=bodies[j];
      var dx=b.x-a.x, dy=b.y-a.y;
      var r2=dx*dx+dy*dy + soft*soft;
      var inv=Math.sqrt(r2);
      var f=G/(r2*inv);            // per unit mass pair factor
      var fx=dx*f, fy=dy*f;
      ax[i]+=fx*b.mass; ay[i]+=fy*b.mass;
      ax[j]-=fx*a.mass; ay[j]-=fy*a.mass;
    }
  }
  for(var i=0;i<n;i++){
    var o=bodies[i];
    o.vx+=ax[i]*dt; o.vy+=ay[i]*dt;
    o.x+=o.vx*dt;   o.y+=o.vy*dt;
  }
  checkMerges();
}

function checkMerges(){
  for(var i=0;i<bodies.length;i++){
    for(var j=i+1;j<bodies.length;j++){
      var a=bodies[i], b=bodies[j];
      var dx=b.x-a.x, dy=b.y-a.y;
      var d=Math.hypot(dx,dy);
      if(d < (a.r+b.r)*0.85){
        // momentum-conserving merge; bigger body keeps identity
        var big = a.mass>=b.mass ? a : b;
        var small = big===a ? b : a;
        var M=a.mass+b.mass;
        big.vx=(a.vx*a.mass+b.vx*b.mass)/M;
        big.vy=(a.vy*a.mass+b.vy*b.mass)/M;
        big.x=(a.x*a.mass+b.x*b.mass)/M;
        big.y=(a.y*a.mass+b.y*b.mass)/M;
        big.mass=M; big.r=Math.cbrt(M)*1.9+3;
        // flash
        flashes.push({x:big.x,y:big.y,r:big.r,life:1,color:small.color});
        bodies.splice(j,1); bodies.splice(i,1);
        big.trail=[];          // redraw fresh trail for new orbit
        bodies.push(big);
        return checkMerges();  // re-scan after mutation
      }
    }
  }
}

/* ============================================================
   RENDER
   ============================================================ */
var flashes=[];
function render(){
  x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,w,h);

  // trails (additive) — fading polylines tinted per body
  if(trailsOn){
    x.globalCompositeOperation='lighter';
    for(var b=0;b<bodies.length;b++){
      var o=bodies[b], tr=o.trail;
      if(tr.length<2) continue;
      var col=o.color[0];
      for(var k=1;k<tr.length;k++){
        var p0=tr[k-1], p1=tr[k];
        var a=(k/tr.length);
        x.globalAlpha=a*a*0.5;
        x.lineWidth=Math.max(1,o.r*0.5*a+0.5);
        x.lineCap='round';
        x.strokeStyle=col;
        x.beginPath();
        x.moveTo(p0.x,p0.y); x.lineTo(p1.x,p1.y); x.stroke();
      }
    }
    x.globalAlpha=1;
    x.globalCompositeOperation='source-over';
  }

  // bodies
  for(var b=0;b<bodies.length;b++){
    var o=bodies[b];
    var g=x.createRadialGradient(o.x-o.r*0.3,o.y-o.r*0.3,o.r*0.1, o.x,o.y,o.r*2.4);
    g.addColorStop(0,'rgba(255,255,255,0.95)');
    g.addColorStop(0.28,'rgba('+hexA(o.color[0],0.9)+')');
    g.addColorStop(0.6,'rgba('+hexA(o.color[1],0.35)+')');
    g.addColorStop(1,'rgba('+hexA(o.color[1],0)+')');
    x.globalCompositeOperation='lighter';
    x.fillStyle=g;
    x.beginPath(); x.arc(o.x,o.y,o.r*2.4,0,6.2832); x.fill();
    // bright core
    x.globalCompositeOperation='source-over';
    var cg=x.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
    cg.addColorStop(0,'#ffffff');
    cg.addColorStop(0.4,o.color[0]);
    cg.addColorStop(1,o.color[1]);
    x.fillStyle=cg;
    x.beginPath(); x.arc(o.x,o.y,o.r,0,6.2832); x.fill();
  }

  // merge flashes
  x.globalCompositeOperation='lighter';
  for(var f=flashes.length-1;f>=0;f--){
    var fl=flashes[f];
    var fg=x.createRadialGradient(fl.x,fl.y,0,fl.x,fl.y,fl.r*3*(1.4-fl.life));
    fg.addColorStop(0,'rgba(255,255,255,'+(fl.life*0.8)+')');
    fg.addColorStop(1,'rgba('+hexA(fl.color,0)+')');
    x.fillStyle=fg;
    x.beginPath(); x.arc(fl.x,fl.y,fl.r*3*(1.4-fl.life),0,6.2832); x.fill();
    fl.life-=0.04; if(fl.life<=0) flashes.splice(f,1);
  }
  x.globalCompositeOperation='source-over';

  // launch preview
  drawLaunch();

  x.globalAlpha=1;
}

/* ---------- helpers ---------- */
function hexA(hex,a){ var n=parseInt(hex.slice(1),16);
  return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a; }
function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }

/* ============================================================
   DRAG-TO-LAUNCH  (slingshot)
   ============================================================ */
var trailsOn=true;
var launching=false, laStart=null, laCur=null;
var LAUNCH_K=0.06;        // drag->velocity scale
var PREVIEW_STEPS=150;    // how far to project the trajectory
var hint=document.getElementById('hint');

function toLocal(e){
  var r=c.getBoundingClientRect();
  var t=e.touches?e.touches[0]:e;
  return {x:t.clientX-r.left, y:t.clientY-r.top};
}

function onDown(e){
  if(e.target!==c) return;
  e.preventDefault();
  var p=toLocal(e);
  launching=true; laStart=p; laCur=p;
  updateHint(p,p);
}
function onMove(e){
  if(!launching) return;
  e.preventDefault();
  laCur=toLocal(e);
  updateHint(laStart,laCur);
}
function onUp(e){
  if(!launching) return;
  e.preventDefault();
  var p=laCur||laStart;
  // velocity = drag vector * scale  (fling in the direction dragged)
  var vx=(p.x-laStart.x)*LAUNCH_K;
  var vy=(p.y-laStart.y)*LAUNCH_K;
  var mass=+massSlider.value;
  var nb=makeBody(laStart.x,laStart.y,vx,vy,mass);
  bodies.push(nb);
  launching=false; laStart=null; laCur=null;
  hint.classList.remove('show');
  syncCount();
}

function updateHint(a,b){
  var dx=b.x-a.x, dy=b.y-a.y;
  var speed=Math.hypot(dx,dy)*LAUNCH_K;
  hint.innerHTML='fling <span class="k">'+speed.toFixed(1)+' u/s</span> · mass '+(+massSlider.value);
  hint.style.left=a.x+'px'; hint.style.top=a.y+'px';
  hint.classList.add('show');
}

/* predict the path a freshly-launched body would take */
function drawLaunch(){
  if(!launching || !laStart || !laCur) return;
  var vx=(laCur.x-laStart.x)*LAUNCH_K;
  var vy=(laCur.y-laStart.y)*LAUNCH_K;
  var mass=+massSlider.value;

  // aim line
  x.setTransform(dpr,0,0,dpr,0,0);
  x.globalCompositeOperation='lighter';
  x.strokeStyle='rgba(124,196,255,0.9)';
  x.lineWidth=2; x.setLineDash([2,7]);
  x.beginPath(); x.moveTo(laStart.x,laStart.y); x.lineTo(laCur.x,laCur.y); x.stroke();
  x.setLineDash([]);

  // ghost body at launch point
  var gr=Math.cbrt(mass)*1.9+3;
  x.globalAlpha=0.9;
  x.fillStyle='#ffffff';
  x.beginPath(); x.arc(laStart.x,laStart.y,gr,0,6.2832); x.fill();
  x.globalAlpha=1;

  // trajectory preview: integrate the new body under current gravity
  var px=laStart.x, py=laStart.y, pvx=vx, pvy=vy;
  var dt=1/60;
  x.setTransform(dpr,0,0,dpr,0,0);
  for(var s=0;s<PREVIEW_STEPS;s++){
    var ax2=0,ay2=0;
    for(var i=0;i<bodies.length;i++){
      var o=bodies[i];
      var ddx=o.x-px, ddy=o.y-py;
      var r2=ddx*ddx+ddy*ddy+soft*soft;
      var inv=Math.sqrt(r2);
      ax2+=ddx/(r2*inv)*G*o.mass;
      ay2+=ddy/(r2*inv)*G*o.mass;
    }
    pvx+=ax2*dt; pvy+=ay2*dt;
    px+=pvx*dt;  py+=pvy*dt;
    if(s%2===0){
      x.globalAlpha=(1-s/PREVIEW_STEPS)*0.7;
      x.fillStyle='#7cc4ff';
      x.beginPath(); x.arc(px,py,1.6,0,6.2832); x.fill();
    }
    if(px<-40||px>w+40||py<-40||py>h+40) break;
  }
  x.globalAlpha=1;
  x.setTransform(dpr,0,0,dpr,0,0);
}

/* ============================================================
   CONTROLS
   ============================================================ */
var playBtn=document.getElementById('playBtn');
var gConst=document.getElementById('gConst'), gVal=document.getElementById('gVal');
var massSlider=document.getElementById('massS'), massVal=document.getElementById('massVal');
var trailsChk=document.getElementById('trails');
var seedBtn=document.getElementById('seedBtn');
var clearBtn=document.getElementById('clearBtn');
var countEl=null;
var paused=false;

gConst.addEventListener('input',function(){ G=+gConst.value; gVal.textContent=gConst.value; });
massSlider.addEventListener('input',function(){ massVal.textContent=massSlider.value; });
trailsChk.addEventListener('change',function(){ trailsOn=trailsChk.checked; });
playBtn.addEventListener('click',function(){
  paused=!paused;
  playBtn.textContent=paused?'▶ Play':'❚❚ Pause';
});
clearBtn.addEventListener('click',function(){ bodies=[]; flashes=[]; syncCount(); });
seedBtn.addEventListener('click',seedSystem);

function syncCount(){
  if(!countEl) return;
  countEl.textContent=bodies.length;
}

/* a tidy little system: a heavy sun + a few orbiting planets */
function seedSystem(){
  bodies=[]; flashes=[];
  var sun=makeBody(cx,cy,0,0,120,['#ffd36b','#ff8a2e']);
  bodies.push(sun);
  var plan=[
    {d:120, m:14, c:['#8fd0ff','#2b6fff']},
    {d:190, m:20, c:['#8affc1','#12b878']},
    {d:265, m:12, c:['#c79bff','#7a3cff']},
    {d:330, m:26, c:['#ff8ad0','#c02bff']}
  ];
  for(var i=0;i<plan.length;i++){
    var p=plan[i];
    var ang=Math.random()*6.2832;
    var px=cx+Math.cos(ang)*p.d, py=cy+Math.sin(ang)*p.d;
    var v=Math.sqrt(G*sun.mass/p.d)*0.92;   // near-circular orbital speed
    var dir=1;
    var nb=makeBody(px,py,-Math.sin(ang)*v*dir,Math.cos(ang)*v*dir,p.m,p.c);
    bodies.push(nb);
  }
  syncCount();
}

/* ============================================================
   RESIZE + LOOP
   ============================================================ */
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  w=innerWidth; h=innerHeight; cx=w/2; cy=h/2;
  c.width=w*dpr; c.height=h*dpr;
  c.style.width=w+'px'; c.style.height=h+'px';
  x.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',function(){ resizeSky(); resize(); });

c.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',onMove);
window.addEventListener('mouseup',onUp);
c.addEventListener('touchstart',onDown,{passive:false});
c.addEventListener('touchmove',onMove,{passive:false});
window.addEventListener('touchend',onUp,{passive:false});

/* keyboard: space = pause, 's' = seed, 'c' = clear */
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  else if(e.key==='s'||e.key==='S') seedSystem();
  else if(e.key==='c'||e.key==='C') clearBtn.click();
});

/* ---------- boot ---------- */
resizeSky();
resize();
seedSystem();

var last=performance.now();
function frame(now){
  var dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;                 // clamp big frame gaps (tab switch)
  if(!paused){
    // sub-step for stability with heavy bodies
    var sub=2;
    for(var s=0;s<sub;s++) step(dt/sub);
    // record trails
    for(var i=0;i<bodies.length;i++){
      var o=bodies[i];
      o.trail.push({x:o.x,y:o.y});
      if(o.trail.length>TRAIL_MAX) o.trail.shift();
    }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
